    topic.claim_help: 'দাবি করতে: জরুরি অবস্থার জন্য, 24 ঘণ্টার মধ্যে বীমাকারীকে জানান; পরিকল্পিত ভর্তির জন্য, 48 ঘণ্টার নোটিশ দিন। নগদবিহীন চিকিৎসার জন্য নেটওয়ার্ক হাসপাতাল ব্যবহার করুন, অন্যথায় প্রতিটি বিল রাখুন এবং ডিসচার্জের 30 দিনের মধ্যে জমা দিন।'
    topic.copay: কো-পে মানে হল আপনি প্রতিটি দাবির একটি অংশ নিজে পরিশোধ করেন, উদাহরণস্বরূপ 10%। এটি প্রিমিয়াম কমায় কিন্তু হাসপাতালে আপনার পরিশোধের পরিমাণ বাড়ায়।
    topic.greet: হ্যালো! আমি কভার, ওয়েটিং পিরিয়ড এবং ক্লেইম ব্যাখ্যা করতে পারি, লোন-এ সাহায্য করতে পারি, অথবা আপনাকে একটি উদ্ধৃতি দিতে পারি।
    topic.human_request: আপনাকে একজন মহিলা উপদেষ্টার সাথে সংযোগ করা হচ্ছে। আমি আপনার প্রশ্নটি লিখে রেখেছি, তাই আপনাকে এটি পুনরাবৃত্তি করতে হবে না।
    topic.injection_refusal: আমি শুধুমাত্র স্বাস্থ্য বীমা এবং ঋণের বিষয়ে সাহায্য করতে পারি, এবং আমি আমার কাজের ধরণ পরিবর্তন করতে পারব না। আপনি সেইগুলো সম্পর্কে কী জানতে চান?
    topic.insurance_quote: খুশি হলাম। এটা 4টি ছোট ধাপ এবং আমি আপনার জন্য তুলনাটি করে দিচ্ছি।
    topic.loan_apply: আমি প্রায় 4টি ধাপে একটি ঋণের প্রস্তাব পরীক্ষা করতে পারি। একজন নিয়ন্ত্রিত ঋণদাতা শুধুমাত্র আপনার বয়স, আয় এবং ইএমআই ব্যবহার করে পরিমাণ নির্ধারণ করেন।
    topic.loan_charges: 'আপনার সম্মত হওয়ার আগে প্রতিটি খরচ মূল তথ্যের বিবৃতিতে উল্লেখ করা আছে: APR, একটি প্রক্রিয়াকরণ ফি এবং GST, EMI, আপনি মোট কত টাকা পরিশোধ করবেন এবং আপনি আসলে কত টাকা পাবেন। ঋণ পাওয়ার জন্য কোনো বীমার প্রয়োজন নেই।'
    topic.loan_cooling_off: ঋণের পরে একটি সংক্ষিপ্ত শীতলীকরণ-অফ সময়কাল আছে (এই ডেমোতে 3 দিন)। এর মধ্যে আপনি কোনো জরিমানা ছাড়াই, ব্যবহৃত দিনের মূল এবং সুদ পরিশোধ করে প্রস্থান করতে পারেন।
    topic.loan_documents: আপনার প্যান এবং একটি দ্রুত ডিজি-লকার পরিচয় যাচাইয়ের প্রয়োজন; আমরা কখনই আপনার আধার নম্বর চাই না। স্ব-নিযুক্ত ঋণগ্রহীতাদের যদি বড় অঙ্কের টাকা চাওয়া হয়, তবে তাদের 6 মাসের ব্যাঙ্ক স্টেটমেন্ট বা 2 বছরের আইটিআর-এর প্রয়োজন হতে পারে।
    topic.loan_emi: ইএমআই হল সেই নির্দিষ্ট পরিমাণ যা আপনি প্রতি মাসে পরিশোধ করেন। এটি ঋণের পরিমাণ, সুদের হার (এপিআর) এবং আপনি যে মাসগুলি বেছে নিয়েছেন তার উপর নির্ভর করে। দীর্ঘ মেয়াদ ইএমআই কমিয়ে দেয় কিন্তু মোট সুদ বাড়িয়ে তোলে।
    topic.loan_prefill: আমি তোমার বলা অনুযায়ী ঋণের ফর্মটি পূরণ করেছি। অনুগ্রহ করে প্রতিটি বিবরণ পরীক্ষা করুন, কোনো কিছু বাদ পড়লে যোগ করুন এবং "আমার অফারটি দেখুন"-এ ট্যাপ করুন। ঋণদাতা পরিমাণ নির্ধারণ করে, আমি নয়।
    topic.medical_bridge: আপনি যদি হাসপাতালে থাকেন এবং আপনার কোনো দাবি অমীমাংসিত থাকে, তাহলে আপনি একটি মেডিকেল ব্রিজ লোনের জন্য আবেদন করতে পারেন। আপনার পলিসি শুধুমাত্র আমাদের বলে যে কেন আপনার টাকার প্রয়োজন; এটি অনুমোদন বা হার পরিবর্তন করে না।
    topic.own_figures: আমি আপনার নিজের প্রিমিয়াম, ইএমআই বা অনুমোদন জানতে পারি না। উদ্ধৃতি এবং অফার স্ক্রিনগুলি চেকের পরে সেগুলি দেখায়, এবং বীমাকারী বা ঋণদাতা সিদ্ধান্ত নেয়।
    topic.pay_bill: আমি আপনার বিল পরিশোধের জন্য প্রস্তুত করতে পারি। বিল খুলুন এবং রিচার্জ করুন, বিলার নির্বাচন করুন এবং বিবরণ দেখুন। আপনি পেমেন্ট-এ ট্যাপ না করা পর্যন্ত কিছুই পরিশোধ করা হবে না।
    topic.pay_recharge: আমি একটি রিচার্জ সেট আপ করতে পারি। বিল খুলুন এবং রিচার্জ করুন, প্ল্যানটি নির্বাচন করুন এবং বিবরণ দেখুন। আপনি পেমেন্ট করার জন্য ট্যাপ না করা পর্যন্ত কিছুই পরিশোধ করা হবে না।
    topic.payment_failed: আমি দুঃখিত যে এটা ঘটেছে। আপনার টাকা কোথায় আছে এবং এর পরে কী করতে হবে তা দেখতে ওপেন পেমেন্ট-এর সাহায্য নিন।
    topic.pre_existing: 'ডায়াবেটিস বা ব্লাড প্রেসারের মতো বিদ্যমান অবস্থাগুলো একটি অপেক্ষার পরে কভার করা হয়, সাধারণত 1 থেকে 3 বছর। আপনাকে অবশ্যই সেগুলি ঘোষণা করতে হবে: একটি গোপন করা দাবির প্রত্যাখ্যানের সবচেয়ে সাধারণ কারণ।'
    topic.privacy: আপনার আধার নম্বর কখনই আমার কাছে বা এআই-এর কাছে পৌঁছায় না। পরিচয় যাচাই করা হয় ডিজিলকারের মাধ্যমে এবং আমরা শুধুমাত্র একটি যাচাইকৃত ফ্ল্যাগ এবং শেষ 4টি সংখ্যা পাই। প্যান ফরম্যাটের জন্য পরীক্ষা করা হয়, মাস্ক করা অবস্থায় দেখানো হয় এবং সংরক্ষণ করা হয় না। এআই শুধুমাত্র বয়সের ব্যান্ড, শহরের স্তর, কভার এবং স্বাস্থ্যের অবস্থা দেখে, আপনার নাম, মোবাইল, প্যান বা আধার কখনোই নয়।
    topic.renewal: 'নবায়ন: আপনার তারিখ দেখতে আমার পলিসিগুলো খুলুন। যখন একটি পলিসির মেয়াদ শেষের কাছাকাছি, তখন আমি নবায়নের প্রস্তুতি নিতে পারি, এবং কোনো চার্জ করার আগে গার্ডরেল সেটি পরীক্ষা করে।'
    topic.settlement_status: আপনার পেমেন্টের অবস্থা এবং কোনো পেমেন্ট আটকে থাকলে তার কারণ দেখতে ওপেন সেটেলমেন্টস-এ যান। যদি কিছু ভুল মনে হয়, তাহলে আমি আপনাকে একজন মানুষের সাথে যোগাযোগ করিয়ে দিতে পারি।
    topic.spend_summary: এই মাসে আপনার টাকা কোথায় খরচ হয়েছে, তা বিভাগ অনুযায়ী দেখতে স্পেন্ড খুলুন। এটা শুধুমাত্র একটি সারসংক্ষেপ, এবং আমি সেখানে কিছুই পরিবর্তন করতে পারব না।
    topic.thanks: আপনাকে স্বাগতম। বীমা বা ঋণ সম্পর্কে অন্য কিছু জিজ্ঞাসা করতে পারেন।
    topic.unknown: আমি ঠিক বুঝতে পারিনি। আপনি জিজ্ঞাসা করতে পারেন কিভাবে দাবি করতে হয়, অপেক্ষার সময়কাল কী, সহ-পরিশোধ বা নগদবিহীন, ঋণ বা ইএমআই কীভাবে কাজ করে, অথবা একটি উদ্ধৃতি চাইতে পারেন।
    topic.waiting_period: অপেক্ষার সময় হল কিছু দাবির পরিশোধের আগের সময়। সাধারণত যেকোনো অসুস্থতার জন্য 30 দিন, এবং আপনার আগে থেকে থাকা অবস্থার জন্য 1 থেকে 3 বছর। দুর্ঘটনা প্রথম দিন থেকেই কভার করা হয়।
  gu-IN:
    disclosure: નમસ્તે! હું ચૌકાસ, પેટીએમની એઆઈ સહાયિકા છું.
    session_intro: 'હું આરોગ્ય વીમો અને લોનમાં મદદ કરી શકું છું: કવર, દાવાઓ, EMI, શુલ્ક અથવા ભાવ.'
    topic.cashless: કેશલેસ એટલે વીમા કંપની નેટવર્ક હોસ્પિટલોમાં સીધા જ હોસ્પિટલને ચૂકવણી કરે છે; તમારે ફક્ત બિન-આવરી લેવાયેલી વસ્તુઓ માટે જ ચૂકવણી કરવાની હોય છે. જો દાખલ થવાનું આયોજન હોય તો પ્રવેશ પહેલાં હોસ્પિટલના વીમા ડેસ્કને પૂર્વ-અધિકૃતતા માટે પૂછો.
    topic.claim_help: 'દાવો કરવા માટે: કટોકટી માટે, 24 કલાકની અંદર વીમા કંપનીને જાણ કરો; આયોજિત દાખલ થવા માટે, 48 કલાકની નોટિસ આપો. કેશલેસ માટે નેટવર્ક હોસ્પિટલનો ઉપયોગ કરો, અન્યથા દરેક બિલ રાખો અને ડિસ્ચાર્જના 30 દિવસની અંદર સબમિટ કરો.'
    topic.copay: કો-પે એટલે કે તમે દરેક દાવાનો હિસ્સો જાતે જ ચૂકવો છો, ઉદાહરણ તરીકે 10%. તે પ્રીમિયમ ઘટાડે છે પરંતુ હોસ્પિટલમાં તમે જે ચૂકવણી કરો છો તે વધારે છે.
    topic.greet: નમસ્તે! હું તમને કવરેજ, વેઇટિંગ પિરિયડ અને દાવાઓ સમજાવી શકું છું, લોનમાં મદદ કરી શકું છું અથવા તમને ભાવ આપી શકું છું.
    topic.human_request: હું તમને એક માનવીય સલાહકાર સાથે જોડી રહી છું. મેં તમારા પ્રશ્નની નોંધ લીધી છે જેથી તમારે તેને પુનરાવર્તિત કરવાની જરૂર નહીં પડે.
    topic.injection_refusal: હું ફક્ત આરોગ્ય વીમો અને લોનના પ્રશ્નોમાં જ મદદ કરી શકું છું, અને હું મારી કામ કરવાની રીત બદલી શકતી નથી. તમે તેના વિશે શું જાણવા માંગો છો?
    topic.insurance_quote: ખુશ છું. તેમાં 4 ટૂંકાં પગલાં છે અને હું તમારા માટે સરખામણી કરું છું.
    topic.loan_apply: હું લગભગ 4 પગલાંમાં લોન ઓફર ચકાસી શકું છું. એક નિયંત્રિત ધિરાણકર્તા માત્ર તમારી ઉંમર, આવક અને EMIનો ઉપયોગ કરીને રકમ નક્કી કરે છે.
    topic.loan_charges: 'તમે સંમત થાઓ તે પહેલાં દરેક ખર્ચ કી ફેક્ટ્સ સ્ટેટમેન્ટમાં છે: APR, પ્રોસેસિંગ ફી વત્તા GST, EMI, તમે ચૂકવો છો તે કુલ રકમ અને તમને ખરેખર મળે છે તે રકમ. લોન મેળવવા માટે કોઈ વીમાની જરૂર નથી.'
    topic.loan_cooling_off: લોન પછી થોડો સમય માટે ઠંડકનો સમયગાળો હોય છે (આ ડેમોમાં 3 દિવસ). તેમાં તમે મુદ્દલ અને વપરાયેલા દિવસોનું વ્યાજ ચૂકવીને દંડ વગર બહાર નીકળી શકો છો.
    topic.loan_documents: તમારે તમારા PAN અને ઝડપી ડિજિટલ લોકર ઓળખની જરૂર છે; અમે ક્યારેય તમારા આધાર નંબર માટે પૂછતા નથી. સ્વ-રોજગાર લેનારાઓ મોટી રકમ માંગી શકે છે, તેમને 6 મહિનાના બેંક સ્ટેટમેન્ટ અથવા 2 વર્ષના ITRની પણ જરૂર પડી શકે છે.
    topic.loan_emi: EMI એ એક નિશ્ચિત રકમ છે જે તમે દર મહિને ચૂકવો છો. તે લોનની રકમ, વ્યાજ દર (APR) અને તમે પસંદ કરેલા મહિનાઓ પર આધાર રાખે છે. લાંબો સમયગાળો EMI ઘટાડે છે પરંતુ કુલ વ્યાજ વધારે છે.
    topic.loan_prefill: મેં લોન ફોર્મ તમે કહ્યું તે મુજબ ભરી દીધું છે. કૃપા કરીને દરેક વિગત તપાસો, ખૂટતી કોઈપણ વસ્તુ ઉમેરો અને મારી ઓફર તપાસો પર ટેપ કરો. લોન આપનાર રકમ નક્કી કરે છે, હું નહીં.
    topic.medical_bridge: જો તમે હોસ્પિટલમાં છો અને તમારો દાવો પેન્ડિંગ છે, તો તમે મેડિકલ બ્રિજ લોન માટે પૂછી શકો છો. તમારી પૉલિસી ફક્ત એટલું જ જણાવે છે કે તમને પૈસાની શા માટે જરૂર છે; તે મંજૂરી અથવા દર બદલતી નથી.
    topic.own_figures: હું તમારી પોતાની પ્રીમિયમ, EMI અથવા મંજૂરી જાણી શકતી નથી. ક્વોટ અને ઓફર સ્ક્રીન ચેક પછી તે બતાવે છે, અને વીમા કંપની અથવા ધિરાણકર્તા નક્કી કરે છે.
    topic.pay_bill: હું તમારું બિલ ચૂકવવા માટે તૈયાર કરી શકું છું. બિલ ખોલો અને રિચાર્જ કરો, બિલર પસંદ કરો અને વિગતો તપાસો. જ્યાં સુધી તમે પે પર ટેપ ન કરો ત્યાં સુધી કંઈપણ ચૂકવવામાં આવતું નથી.
    topic.pay_recharge: હું રિચાર્જ સેટ કરી શકું છું. બિલ ખોલો અને રિચાર્જ કરો, પ્લાન પસંદ કરો અને વિગતો તપાસો. જ્યાં સુધી તમે પે પર ટેપ ન કરો ત્યાં સુધી કંઈપણ ચૂકવવામાં આવતું નથી.
    topic.payment_failed: મને માફ કરશો કે આવું થયું. તમારા પૈસા ક્યાં છે અને આગળ શું કરવું તે જોવા માટે ઓપન પેમેન્ટ મદદ લો.
    topic.pre_existing: 'ડાયાબિટીસ અથવા બીપી જેવી હાલની પરિસ્થિતિઓ સામાન્ય રીતે 1 થી 3 વર્ષના વેઇટિંગ પિરિયડ પછી આવરી લેવામાં આવે છે. તમારે તે જાહેર કરવું આવશ્યક છે: એક છુપાવવું એ નકારાયેલા દાવાઓનું સૌથી સામાન્ય કારણ છે.'
    topic.privacy: તમારો આધાર નંબર ક્યારેય મારા સુધી કે AI સુધી પહોંચતો નથી. ઓળખ DigiLocker દ્વારા ચકાસવામાં આવે છે અને અમને ફક્ત ચકાસાયેલ ફ્લેગ વત્તા છેલ્લા 4 અંકો મળે છે. PAN ફોર્મેટ માટે તપાસવામાં આવે છે, માસ્ક્ડ બતાવવામાં આવે છે અને સંગ્રહિત થતો નથી. AI ફક્ત ઉંમર, શહેરનું સ્તર, કવર અને આરોગ્યની સ્થિતિ જુએ છે, તમારું નામ, મોબાઇલ, PAN અથવા આધાર ક્યારેય નહીં.
    topic.renewal: 'નવીકરણો: તમારી તારીખો જોવા માટે મારી પોલિસીઓ ખોલો. જ્યારે કોઈ પોલિસી તેના અંતની નજીક હોય, ત્યારે હું નવીકરણ તૈયાર કરી શકું છું, અને ગાર્ડરેલ કંઈપણ ચાર્જ થાય તે પહેલાં તેની તપાસ કરે છે.'
    topic.settlement_status: તમારા પેઆઉટ્સની સ્થિતિ જોવા માટે ઓપન સેટલમેન્ટ્સ ખોલો અને જો કોઈ હોલ્ડ પર હોય તો તેનું કારણ જુઓ. જો કંઈક ખોટું લાગે છે, તો હું તમને એક માનવી સાથે કનેક્ટ કરી શકું છું.
    topic.spend_summary: તમારા પૈસા આ મહિને ક્યાં ગયા તે જોવા માટે સ્પન્ડ્સ ખોલો, કેટેગરી પ્રમાણે. આ માત્ર સારાંશ છે, અને હું ત્યાં કંઈપણ બદલી શકતી નથી.
    topic.thanks: તમારું સ્વાગત છે. વીમા અથવા લોન વિશે મને બીજું કંઈપણ પૂછો.
    topic.unknown: મને તે બરાબર સમજાયું નહીં. તમે પૂછી શકો છો કે દાવો કેવી રીતે કરવો, રાહ જોવાનો સમયગાળો શું છે, કો-પે અથવા કેશલેસ વિશે, લોન અથવા EMI કેવી રીતે કામ કરે છે, અથવા ભાવ પૂછી શકો છો.
    topic.waiting_period: વેઇટિંગ પિરિયડ એ અમુક દાવાઓ ચૂકવવાપાત્ર થાય તે પહેલાંનો સમય છે. સામાન્ય રીતે કોઈપણ બીમારી માટે 30 દિવસ અને તમારી પાસે પહેલેથી જ હોય તેવી પરિસ્થિતિઓ માટે 1 થી 3 વર્ષ. અકસ્માતો પહેલા દિવસથી જ આવરી લેવામાં આવે છે.
  hi-IN:
    disclosure: नमस्ते! मैं चौकास हूँ, पेटीएम की एआई असिस्टेंट।
    session_intro: 'मैं स्वास्थ्य बीमा और ऋण में मदद कर सकती हूँ: कवर, दावे, ईएमआई, शुल्क या कोटेशन।'
    topic.cashless: कैशलेस का मतलब है कि बीमाकर्ता नेटवर्क अस्पतालों में सीधे अस्पताल को भुगतान करता है; आप केवल गैर-कवर वस्तुओं का भुगतान करते हैं। यदि योजना है तो भर्ती से पहले अस्पताल के बीमा डेस्क से पूर्व-प्राधिकरण के लिए पूछें।
    topic.claim_help: 'दावा करने के लिए: आपातकाल के लिए, 24 घंटों के भीतर बीमाकर्ता को सूचित करें; नियोजित प्रवेश के लिए, 48 घंटे का नोटिस दें। कैशलेस के लिए नेटवर्क अस्पताल का उपयोग करें, अन्यथा प्रत्येक बिल रखें और डिस्चार्ज के 30 दिनों के भीतर जमा करें।'
    topic.copay: को-पे का मतलब है कि आप प्रत्येक दावे का एक हिस्सा खुद भुगतान करती हैं, उदाहरण के लिए 10%। इससे प्रीमियम कम हो जाता है लेकिन अस्पताल में आपका भुगतान बढ़ जाता है।
    topic.greet: नमस्ते! मैं कवर, प्रतीक्षा अवधि और दावों के बारे में बता सकती हूँ, ऋण में मदद कर सकती हूँ, या आपको एक कोटेशन दिला सकती हूँ।
    topic.human_request: आपको एक महिला सलाहकार से जोड़ा जा रहा है। मैंने आपके प्रश्न को नोट कर लिया है इसलिए आपको इसे दोहराने की आवश्यकता नहीं होगी।
    topic.injection_refusal: मैं केवल स्वास्थ्य बीमा और ऋण संबंधी सवालों में मदद कर सकती हूँ, और मैं अपने काम करने के तरीके को नहीं बदल सकती। आप उनके बारे में क्या जानना चाहेंगी?
    topic.insurance_quote: मुझे खुशी होगी। इसमें 4 छोटे कदम लगते हैं और मैं आपके लिए तुलना करती हूँ।
    topic.loan_apply: मैं लगभग 4 चरणों में एक ऋण प्रस्ताव की जांच कर सकती हूँ। एक विनियमित ऋणदाता केवल आपकी उम्र, आय और ईएमआई का उपयोग करके राशि तय करता है।
    topic.loan_charges: 'हर लागत मुख्य तथ्य विवरण में है, इससे पहले कि आप सहमत हों: APR, एक प्रोसेसिंग शुल्क और GST, EMI, वह कुल राशि जो आप चुकाती हैं और वह राशि जो आपको वास्तव में मिलती है। ऋण प्राप्त करने के लिए किसी बीमा की आवश्यकता नहीं है।'
    topic.loan_cooling_off: लोन के बाद एक छोटी कूलिंग-ऑफ अवधि होती है (इस डेमो में 3 दिन)। इसमें आप बिना किसी पेनल्टी के, उपयोग किए गए दिनों के लिए मूलधन और ब्याज का भुगतान करके बाहर निकल सकती हैं।
    topic.loan_documents: आपको अपने पैन और एक त्वरित डिजिलॉकर पहचान की जांच की आवश्यकता है; हम कभी भी आपका आधार नंबर नहीं मांगते। बड़ी राशि मांगने वाली स्व-नियोजित उधारकर्ताओं को 6 महीने के बैंक स्टेटमेंट या 2 साल के आईटीआर की भी आवश्यकता हो सकती है।
    topic.loan_emi: ईएमआई वह निश्चित राशि है जो आप हर महीने भुगतान करती हैं। यह ऋण राशि, ब्याज दर (एपीआर) और आपके द्वारा चुने गए महीनों पर निर्भर करता है। लंबी अवधि ईएमआई को कम करती है लेकिन कुल ब्याज को बढ़ाती है।
    topic.loan_prefill: मैंने तुम्हारे कहे अनुसार लोन फॉर्म भर दिया है। कृपया हर विवरण की जाँच करें, जो कुछ भी गायब है उसे जोड़ें, और मेरा प्रस्ताव जाँचें पर टैप करें। ऋणदाता राशि तय करता है, मैं नहीं।
    topic.medical_bridge: अगर आप अस्पताल में हैं और आपका दावा लंबित है, तो आप मेडिकल ब्रिज लोन के लिए पूछ सकती हैं। आपकी पॉलिसी हमें केवल यह बताती है कि आपको पैसे की आवश्यकता क्यों है; इससे अनुमोदन या दर में कोई बदलाव नहीं होता है।
    topic.own_figures: मैं आपका प्रीमियम, ईएमआई या अनुमोदन नहीं जान सकती। कोट और ऑफर स्क्रीन चेक के बाद उन्हें दिखाती हैं, और बीमाकर्ता या ऋणदाता तय करते हैं।
    topic.pay_bill: मैं आपका बिल भुगतान के लिए तैयार कर सकती हूँ। बिल खोलें और रिचार्ज करें, बिलर चुनें और विवरण जांचें। जब तक आप भुगतान पर टैप नहीं करतीं, तब तक कुछ भी भुगतान नहीं किया जाता है।
    topic.pay_recharge: मैं रिचार्ज सेट कर सकती हूँ। बिल खोलकर रिचार्ज करें, प्लान चुनें और विवरण देखें। जब तक आप पे पर टैप नहीं करतीं, तब तक कुछ भी भुगतान नहीं किया जाता है।
    topic.payment_failed: मुझे खेद है कि ऐसा हुआ। ओपन पेमेंट से मदद मिलेगी कि आपका पैसा कहां है और आगे क्या करना है।
    topic.pre_existing: 'मधुमेह या बीपी जैसी मौजूदा स्थितियाँ प्रतीक्षा अवधि के बाद कवर की जाती हैं, आमतौर पर 1 से 3 साल। आपको उन्हें घोषित करना होगा: एक को छिपाना अस्वीकृत दावों का सबसे आम कारण है।'
    topic.privacy: आपका आधार नंबर कभी भी मुझ तक या एआई तक नहीं पहुँचता। पहचान डिजिलॉकर के माध्यम से सत्यापित की जाती है और हमें केवल एक सत्यापित ध्वज और अंतिम 4 अंक मिलते हैं। पैन को प्रारूप के लिए जांचा जाता है, मास्क्ड दिखाया जाता है और संग्रहीत नहीं किया जाता है। एआई केवल आयु बैंड, शहर स्तर, कवर और स्वास्थ्य स्थितियाँ देखती है, कभी भी आपका नाम, मोबाइल, पैन या आधार नहीं।
    topic.renewal: 'नवीनीकरण: अपनी तिथियाँ देखने के लिए मेरी नीतियाँ खोलें। जब कोई पॉलिसी अपनी समाप्ति के करीब होती है तो मैं नवीनीकरण तैयार कर सकती हूँ, और गार्डरेल कुछ भी चार्ज करने से पहले इसकी जाँच करता है।'
    topic.settlement_status: अपने भुगतान की स्थिति और कारण देखने के लिए ओपन सेटलमेंट्स खोलें, अगर कोई रुका हुआ है तो। अगर कुछ गलत दिखता है, तो मैं आपको एक महिला से जोड़ सकती हूँ।
    topic.spend_summary: इस महीने आपका पैसा कहाँ गया, यह देखने के लिए ओपन स्पेंड्स खोलें, श्रेणी के अनुसार। यह केवल एक सारांश है, और मैं वहाँ कुछ भी नहीं बदल सकती।
    topic.thanks: आपका स्वागत है। बीमा या ऋण के बारे में मुझसे और कुछ भी पूछें।
    topic.unknown: मुझे ठीक से समझ में नहीं आया। आप पूछ सकती हैं कि दावा कैसे करें, प्रतीक्षा अवधि क्या होती है, सह-भुगतान या कैशलेस के बारे में, ऋण या ईएमआई कैसे काम करता है, या कोटेशन के लिए पूछ सकती हैं।
    topic.waiting_period: प्रतीक्षा अवधि कुछ दावों के भुगतान योग्य होने से पहले का समय है। आमतौर पर किसी भी बीमारी के लिए 30 दिन, और उन स्थितियों के लिए 1 से 3 साल जो आपको पहले से हैं। दुर्घटनाएँ पहले दिन से कवर की जाती हैं।
  kn-IN:
    disclosure: ನಮಸ್ಕಾರ! ನಾನು ಚೌಕಾಸ್, ಪೇಟಿಎಂನ AI ಸಹಾಯಕ.
    session_intro: 'ನಾನು ಆರೋಗ್ಯ ವಿಮೆ ಮತ್ತು ಸಾಲಗಳೊಂದಿಗೆ ಸಹಾಯ ಮಾಡಬಲ್ಲೆ: ರಕ್ಷಣೆ, ಕ್ಲೈಮ್‌ಗಳು, ಇಎಂಐ, ಶುಲ್ಕಗಳು ಅಥವಾ ಉದ್ಧರಣ.'
    topic.cashless: ನಗದು ರಹಿತ ಎಂದರೆ ವಿಮಾದಾರರು ನೇರವಾಗಿ ನೆಟ್‌ವರ್ಕ್ ಆಸ್ಪತ್ರೆಗಳಲ್ಲಿ ಆಸ್ಪತ್ರೆಗೆ ಪಾವತಿಸುತ್ತಾರೆ; ನೀವು ಕೇವಲ ರಕ್ಷಣೆ ಇಲ್ಲದ ವಸ್ತುಗಳಿಗೆ ಮಾತ್ರ ಪಾವತಿಸುತ್ತೀರಿ. ಪ್ರವೇಶವನ್ನು ಯೋಜಿಸಿದ್ದರೆ, ಆಸ್ಪತ್ರೆಯ ವಿಮಾ ಕೌಂಟರ್‌ನಲ್ಲಿ ಪೂರ್ವ-ಅಧಿಕೃತಗೊಳಿಸುವಿಕೆಗಾಗಿ ಕೇಳಿ.
    topic.claim_help: 'ಹಕ್ಕು ಸಾಧಿಸಲು: ತುರ್ತು ಪರಿಸ್ಥಿತಿಗಾಗಿ, 24 ಗಂಟೆಗಳ ಒಳಗೆ ವಿಮಾದಾರರಿಗೆ ತಿಳಿಸಿ; ಯೋಜಿತ ದಾಖಲಾತಿಗಾಗಿ, 48 ಗಂಟೆಗಳ ಮುಂಚಿತವಾಗಿ ತಿಳಿಸಿ. ನಗದು ರಹಿತ ಚಿಕಿತ್ಸೆಗಾಗಿ ನೆಟ್ವರ್ಕ್ ಆಸ್ಪತ್ರೆಯನ್ನು ಬಳಸಿ, ಇಲ್ಲದಿದ್ದರೆ ಪ್ರತಿ ಬಿಲ್ ಅನ್ನು ಇಟ್ಟುಕೊಂಡು ಬಿಡುಗಡೆಯಾದ 30 ದಿನಗಳ ಒಳಗೆ ಸಲ್ಲಿಸಿ.'
    topic.copay: ಸಹ-ಪಾವತಿ ಎಂದರೆ ನೀವು ಪ್ರತಿ ಕ್ಲೈಮ್‌ನ ಒಂದು ಭಾಗವನ್ನು ನೀವೇ ಪಾವತಿಸುತ್ತೀರಿ, ಉದಾಹರಣೆಗೆ 10%. ಇದು ಪ್ರೀಮಿಯಂ ಅನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ ಆದರೆ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ನೀವು ಪಾವತಿಸುವುದನ್ನು ಹೆಚ್ಚಿಸುತ್ತದೆ.
    topic.greet: ನಮಸ್ಕಾರ! ನಾನು ಕವರ್, ಕಾಯುವ ಅವಧಿಗಳು ಮತ್ತು ಕ್ಲೈಮ್‌ಗಳನ್ನು ವಿವರಿಸಬಲ್ಲೆ, ಸಾಲಕ್ಕೆ ಸಹಾಯ ಮಾಡಬಲ್ಲೆ ಅಥವಾ ನಿಮಗೆ ಉದ್ಧರಣವನ್ನು ಪಡೆಯಲು ಸಹಾಯ ಮಾಡಬಲ್ಲೆ.
    topic.human_request: ನಿಮ್ಮನ್ನು ಒಬ್ಬ ಮಹಿಳಾ ಸಲಹೆಗಾರರಿಗೆ ಸಂಪರ್ಕಿಸುತ್ತಿದ್ದೇನೆ. ನಾನು ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಗಮನಿಸಿದ್ದೇನೆ, ಆದ್ದರಿಂದ ನೀವು ಅದನ್ನು ಪುನರಾವರ್ತಿಸುವ ಅಗತ್ಯವಿಲ್ಲ.
    topic.injection_refusal: ನಾನು ಆರೋಗ್ಯ ವಿಮೆ ಮತ್ತು ಸಾಲದ ಪ್ರಶ್ನೆಗಳಿಗೆ ಮಾತ್ರ ಸಹಾಯ ಮಾಡಬಲ್ಲೆ, ಮತ್ತು ನಾನು ಕೆಲಸ ಮಾಡುವ ವಿಧಾನವನ್ನು ಬದಲಾಯಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ. ಅವುಗಳ ಬಗ್ಗೆ ನೀವು ಏನು ತಿಳಿದುಕೊಳ್ಳಲು ಬಯಸುತ್ತೀರಿ?
    topic.insurance_quote: ಖುಷಿ ಇದೆ. ಇದು 4 ಸಣ್ಣ ಹೆಜ್ಜೆಗಳನ್ನು ತೆಗೆದುಕೊಳ್ಳುತ್ತದೆ ಮತ್ತು ನಾನು ನಿಮಗಾಗಿ ಹೋಲಿಕೆ ಮಾಡುತ್ತೇನೆ.
    topic.loan_apply: ನಾನು ಸುಮಾರು 4 ಹಂತಗಳಲ್ಲಿ ಸಾಲದ ಪ್ರಸ್ತಾಪವನ್ನು ಪರಿಶೀಲಿಸಬಲ್ಲೆ. ಒಬ್ಬ ನಿಯಂತ್ರಿತ ಸಾಲದಾತಳು ನಿಮ್ಮ ವಯಸ್ಸು, ಆದಾಯ ಮತ್ತು ಇಎಂಐಗಳನ್ನು ಮಾತ್ರ ಬಳಸಿ ಮೊತ್ತವನ್ನು ನಿರ್ಧರಿಸುತ್ತಾಳೆ.
    topic.loan_charges: 'ನೀವು ಒಪ್ಪಿಕೊಳ್ಳುವ ಮೊದಲು ಪ್ರತಿಯೊಂದು ವೆಚ್ಚವು ಪ್ರಮುಖ ಅಂಶಗಳ ಹೇಳಿಕೆಯಲ್ಲಿರುತ್ತದೆ: APR, ಸಂಸ್ಕರಣಾ ಶುಲ್ಕ ಮತ್ತು GST, EMI, ನೀವು ಮರುಪಾವತಿ ಮಾಡುವ ಒಟ್ಟು ಮೊತ್ತ ಮತ್ತು ನೀವು ನಿಜವಾಗಿ ಸ್ವೀಕರಿಸುವ ಮೊತ್ತ. ಸಾಲ ಪಡೆಯಲು ಯಾವುದೇ ವಿಮೆ ಅಗತ್ಯವಿಲ್ಲ.'
    topic.loan_cooling_off: ಸಾಲದ ನಂತರ ಒಂದು ಸಣ್ಣ ತಂಪಾಗಿಸುವ ಅವಧಿ ಇದೆ (ಈ ಡೆಮೊದಲ್ಲಿ 3 ದಿನಗಳು). ಅದರಲ್ಲಿ ನೀವು ಯಾವುದೇ ದಂಡವಿಲ್ಲದೆ, ಬಳಸಿದ ದಿನಗಳ ಅಸಲು ಮತ್ತು ಬಡ್ಡಿಯನ್ನು ಮರುಪಾವತಿ ಮಾಡುವ ಮೂಲಕ ನಿರ್ಗಮಿಸಬಹುದು.
    topic.loan_documents: ನಿಮಗೆ ನಿಮ್ಮ ಪ್ಯಾನ್ ಮತ್ತು ತ್ವರಿತ ಡಿಜಿಲಾಕರ್ ಗುರುತಿನ ಪರಿಶೀಲನೆ ಅಗತ್ಯವಿದೆ; ನಾವು ನಿಮ್ಮ ಆಧಾರ್ ಸಂಖ್ಯೆಯನ್ನು ಎಂದಿಗೂ ಕೇಳುವುದಿಲ್ಲ. ಹೆಚ್ಚಿನ ಮೊತ್ತವನ್ನು ಕೇಳುವ ಸ್ವಯಂ ಉದ್ಯೋಗಿ ಸಾಲಗಾರರಿಗೆ 6 ತಿಂಗಳ ಬ್ಯಾಂಕ್ ಸ್ಟೇಟ್‌ಮೆಂಟ್‌ಗಳು ಅಥವಾ 2 ವರ್ಷಗಳ ಐಟಿಆರ್ ಅಗತ್ಯವಾಗಬಹುದು.
    topic.loan_emi: EMI ಎಂದರೆ ನೀವು ಪ್ರತಿ ತಿಂಗಳು ಪಾವತಿಸುವ ಸ್ಥಿರ ಮೊತ್ತ. ಇದು ಸಾಲದ ಮೊತ್ತ, ಬಡ್ಡಿ ದರ (APR) ಮತ್ತು ನೀವು ಆಯ್ಕೆ ಮಾಡುವ ತಿಂಗಳುಗಳನ್ನು ಅವಲಂಬಿಸಿರುತ್ತದೆ. ದೀರ್ಘಾವಧಿಯ ಟೆನ್ಯೂರ್ EMI ಅನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ ಆದರೆ ಒಟ್ಟು ಬಡ್ಡಿಯನ್ನು ಹೆಚ್ಚಿಸುತ್ತದೆ.
    topic.loan_prefill: ನೀವು ಹೇಳಿದಂತೆ ನಾನು ಸಾಲದ ಫಾರ್ಮ್ ಅನ್ನು ಭರ್ತಿ ಮಾಡಿದ್ದೇನೆ. ದಯವಿಟ್ಟು ಪ್ರತಿಯೊಂದು ವಿವರವನ್ನು ಪರಿಶೀಲಿಸಿ, ಕಾಣೆಯಾದದ್ದನ್ನು ಸೇರಿಸಿ ಮತ್ತು ನನ್ನ ಕೊಡುಗೆಯನ್ನು ಪರಿಶೀಲಿಸಿ. ಸಾಲ ನೀಡುವವರು ಮೊತ್ತವನ್ನು ನಿರ್ಧರಿಸುತ್ತಾರೆ, ನಾನು ಅಲ್ಲ.
    topic.medical_bridge: ನೀವು ಆಸ್ಪತ್ರೆಯಲ್ಲಿದ್ದರೆ ಮತ್ತು ಕ್ಲೈಮ್ ಬಾಕಿ ಇದ್ದರೆ, ನೀವು ವೈದ್ಯಕೀಯ ಬ್ರಿಡ್ಜ್ ಲೋನ್‌ಗಾಗಿ ಕೇಳಬಹುದು. ನಿಮ್ಮ ಪಾಲಿಸಿ ನಿಮಗೆ ಹಣ ಏಕೆ ಬೇಕು ಎಂದು ಮಾತ್ರ ಹೇಳುತ್ತದೆ; ಇದು ಅನುಮೋದನೆ ಅಥವಾ ದರವನ್ನು ಬದಲಾಯಿಸುವುದಿಲ್ಲ.
    topic.own_figures: ನಿಮ್ಮ ಸ್ವಂತ ಪ್ರೀಮಿಯಂ, ಇಎಂಐ ಅಥವಾ ಅನುಮೋದನೆಯ ಬಗ್ಗೆ ನನಗೆ ತಿಳಿಯಲು ಸಾಧ್ಯವಿಲ್ಲ. ಉದ್ಧರಣ ಮತ್ತು ಕೊಡುಗೆ ಪರದೆಗಳು ಪರಿಶೀಲನೆಯ ನಂತರ ಅವುಗಳನ್ನು ತೋರಿಸುತ್ತವೆ ಮತ್ತು ವಿಮಾದಾರ ಅಥವಾ ಸಾಲದಾತ ನಿರ್ಧರಿಸುತ್ತಾರೆ.
    topic.pay_bill: ನಿಮ್ಮ ಬಿಲ್ ಅನ್ನು ಪಾವತಿಸಲು ನಾನು ಸಿದ್ಧಪಡಿಸಬಲ್ಲೆ. ಬಿಲ್‌ಗಳನ್ನು ತೆರೆಯಿರಿ ಮತ್ತು ರೀಚಾರ್ಜ್ ಮಾಡಿ, ಬಿಲ್ಲಿಂಗ್ ಮಾಡುವವರನ್ನು ಆಯ್ಕೆಮಾಡಿ ಮತ್ತು ವಿವರಗಳನ್ನು ಪರಿಶೀಲಿಸಿ. ನೀವು ಪಾವತಿಸು (Pay) ಟ್ಯಾಪ್ ಮಾಡುವವರೆಗೆ ಏನನ್ನೂ ಪಾವತಿಸಲಾಗುವುದಿಲ್ಲ.
    topic.pay_recharge: ನಾನು ರೀಚಾರ್ಜ್ ಅನ್ನು ಹೊಂದಿಸಬಲ್ಲೆ. ಬಿಲ್‌ಗಳನ್ನು ತೆರೆಯಿರಿ ಮತ್ತು ರೀಚಾರ್ಜ್ ಮಾಡಿ, ಯೋಜನೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ ಮತ್ತು ವಿವರಗಳನ್ನು ಪರಿಶೀಲಿಸಿ. ನೀವು ಪಾವತಿಸು ಟ್ಯಾಪ್ ಮಾಡುವವರೆಗೆ ಏನನ್ನೂ ಪಾವತಿಸಲಾಗುವುದಿಲ್ಲ.
    topic.payment_failed: ನನಗೆ ಆದುದಕ್ಕೆ ವಿಷಾದವಿದೆ. ನಿಮ್ಮ ಹಣ ಎಲ್ಲಿದೆ ಮತ್ತು ಮುಂದೆ ಏನು ಮಾಡಬೇಕೆಂದು ನೋಡಲು ಓಪನ್ ಪೇಮೆಂಟ್ ಸಹಾಯವನ್ನು ಪಡೆಯಿರಿ.
    topic.pre_existing: 'ಮಧುಮೇಹ ಅಥವಾ ಬಿಪಿ (ರಕ್ತದೊತ್ತಡ) ನಂತಹ ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಪರಿಸ್ಥಿತಿಗಳನ್ನು ಕಾಯುವ ಅವಧಿಯ ನಂತರ ಒಳಗೊಂಡಿರುತ್ತದೆ, ಸಾಮಾನ್ಯವಾಗಿ 1 ರಿಂದ 3 ವರ್ಷಗಳು. ನೀವು ಅವುಗಳನ್ನು ಘೋಷಿಸಬೇಕು: ಒಂದನ್ನು ಮರೆಮಾಡುವುದು ತಿರಸ್ಕರಿಸಲ್ಪಟ್ಟ ಹಕ್ಕುಗಳಿಗೆ ಸಾಮಾನ್ಯ ಕಾರಣವಾಗಿದೆ.'
    topic.privacy: ನಿಮ್ಮ ಆಧಾರ್ ಸಂಖ್ಯೆ ಎಂದಿಗೂ ನನ್ನನ್ನು ಅಥವಾ AI ಅನ್ನು ತಲುಪುವುದಿಲ್ಲ. ಡಿಜಿಲಾಕರ್ ಮೂಲಕ ಗುರುತನ್ನು ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ನಮಗೆ ಪರಿಶೀಲಿಸಿದ ಫ್ಲ್ಯಾಗ್ ಮತ್ತು ಕೊನೆಯ 4 ಅಂಕೆಗಳು ಮಾತ್ರ ಸಿಗುತ್ತವೆ. PAN ಅನ್ನು ಫಾರ್ಮ್ಯಾಟ್‌ಗಾಗಿ ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ, ಮರೆಮಾಚಲ್ಪಟ್ಟಂತೆ ತೋರಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ಸಂಗ್ರಹಿಸಲಾಗುವುದಿಲ್ಲ. AI ವಯಸ್ಸಿನ ಗುಂಪು, ನಗರದ ಶ್ರೇಣಿ, ರಕ್ಷಣೆ ಮತ್ತು ಆರೋಗ್ಯ ಪರಿಸ್ಥಿತಿಗಳನ್ನು ಮಾತ್ರ ನೋಡುತ್ತದೆ, ನಿಮ್ಮ ಹೆಸರು, ಮೊಬೈಲ್, PAN ಅಥವಾ ಆಧಾರ್ ಅನ್ನು ಎಂದಿಗೂ ಅಲ್ಲ.
    topic.renewal: 'ನವೀಕರಣಗಳು: ನಿಮ್ಮ ದಿನಾಂಕಗಳನ್ನು ನೋಡಲು ನನ್ನ ಪಾಲಿಸಿಗಳನ್ನು ತೆರೆಯಿರಿ. ಪಾಲಿಸಿಯು ಅದರ ಅಂತ್ಯಕ್ಕೆ ಹತ್ತಿರವಾದಾಗ ನಾನು ನವೀಕರಣವನ್ನು ತಯಾರಿಸಬಹುದು, ಮತ್ತು ಏನನ್ನೂ ವಿಧಿಸುವ ಮೊದಲು ಗಾರ್ಡ್‌ರೈಲ್ ಅದನ್ನು ಪರಿಶೀಲಿಸುತ್ತದೆ.'
    topic.settlement_status: ನಿಮ್ಮ ಪಾವತಿಗಳ ಸ್ಥಿತಿಯನ್ನು ನೋಡಲು ಮತ್ತು ಯಾವುದಾದರೂ ತಡೆಹಿಡಿಯಲ್ಪಟ್ಟಿದ್ದರೆ ಕಾರಣವನ್ನು ತಿಳಿಯಲು ಮುಕ್ತ ವಸಾಹತುಗಳನ್ನು ತೆರೆಯಿರಿ. ಏನಾದರೂ ತಪ್ಪಾಗಿ ಕಾಣಿಸಿದರೆ, ನಾನು ನಿಮ್ಮನ್ನು ಒಬ್ಬ ಮಹಿಳೆಗೆ ಸಂಪರ್ಕಿಸಬಹುದು.
    topic.spend_summary: ನಿಮ್ಮ ಹಣ ಈ ತಿಂಗಳು ಎಲ್ಲಿಗೆ ಹೋಯಿತು ಎಂದು ನೋಡಲು ಖರ್ಚುಗಳನ್ನು ತೆರೆಯಿರಿ, ವರ್ಗಗಳ ಪ್ರಕಾರ. ಇದು ಕೇವಲ ಸಾರಾಂಶ, ಮತ್ತು ನಾನು ಅಲ್ಲಿ ಏನನ್ನೂ ಬದಲಾಯಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.
    topic.thanks: ನಿಮಗೆ ಸ್ವಾಗತ. ವಿಮೆ ಅಥವಾ ಸಾಲಗಳ ಬಗ್ಗೆ ಬೇರೆ ಏನಾದರೂ ಕೇಳಿ.
    topic.unknown: ನನಗೆ ಅದು ಸರಿಯಾಗಿ ಅರ್ಥವಾಗಲಿಲ್ಲ. ನೀವು ಹೇಗೆ ಕ್ಲೈಮ್ ಮಾಡುವುದು, ಕಾಯುವ ಅವಧಿ ಎಷ್ಟು, ಸಹ-ಪಾವತಿ ಅಥವಾ ನಗದು ರಹಿತದ ಬಗ್ಗೆ, ಸಾಲ ಅಥವಾ ಇಎಂಐ ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ ಎಂದು ಕೇಳಬಹುದು ಅಥವಾ ಉದ್ಧರಣಕ್ಕಾಗಿ ಕೇಳಬಹುದು.
    topic.waiting_period: ಕಾಯುವ ಅವಧಿ ಎಂದರೆ ಕೆಲವು ಕ್ಲೈಮ್‌ಗಳನ್ನು ಪಾವತಿಸುವ ಮೊದಲು ಇರುವ ಸಮಯ. ಸಾಮಾನ್ಯವಾಗಿ ಯಾವುದೇ ಕಾಯಿಲೆಗೆ 30 ದಿನಗಳು ಮತ್ತು ನಿಮಗೆ ಈಗಾಗಲೇ ಇರುವ ಪರಿಸ್ಥಿತಿಗಳಿಗೆ 1 ರಿಂದ 3 ವರ್ಷಗಳು. ಅಪಘಾತಗಳನ್ನು ಮೊದಲ ದಿನದಿಂದಲೇ ಭರಿಸಲಾಗುತ್ತದೆ.
  ml-IN:
    disclosure: ഹലോ! ഞാൻ ചൗകാസ് ആണ്, പേടിഎമ്മിന്റെ AI അസിസ്റ്റന്റ്.
    session_intro: 'ആരോഗ്യ ഇൻഷുറൻസിനും ലോണുകൾക്കും ഞാൻ സഹായിക്കാം: കവർ, ക്ലെയിമുകൾ, ഇഎംഐ, ചാർജുകൾ അല്ലെങ്കിൽ ഒരു ഉദ്ധരണി.'
    topic.cashless: ക്യാഷ്‌ലെസ് എന്നാൽ ഇൻഷുറൻസ് കമ്പനി നെറ്റ്‌വർക്ക് ആശുപത്രികളിൽ നേരിട്ട് ആശുപത്രിക്ക് പണം നൽകുന്നു എന്നാണ് അർത്ഥം; പരിരക്ഷയില്ലാത്ത ഇനങ്ങൾക്ക് മാത്രമേ നിങ്ങൾ പണം നൽകേണ്ടതുള്ളൂ. അഡ്മിഷൻ ആസൂത്രണം ചെയ്തിട്ടുണ്ടെങ്കിൽ, പ്രവേശനത്തിന് മുമ്പ് ആശുപത്രിയുടെ ഇൻഷുറൻസ് ഡെസ്കിനോട് മുൻകൂർ അനുമതി ചോദിക്കുക.
    topic.claim_help: 'ക്ലെയിം ചെയ്യാൻ: അത്യാവശ്യ ഘട്ടങ്ങളിൽ, 24 മണിക്കൂറിനുള്ളിൽ ഇൻഷുറൻസ് കമ്പനിയെ അറിയിക്കുക; മുൻകൂട്ടി തീരുമാനിച്ച അഡ്മിഷന് 48 മണിക്കൂർ മുൻപ് അറിയിക്കുക. പണം നൽകാതെ ചികിത്സിക്കാൻ ഒരു നെറ്റ്വർക്ക് ഹോസ്പിറ്റൽ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ എല്ലാ ബില്ലുകളും സൂക്ഷിക്കുകയും ഡിസ്ചാർജ് ആയി 30 ദിവസത്തിനുള്ളിൽ സമർപ്പിക്കുകയും ചെയ്യുക.'
    topic.copay: കോ-പേ എന്നാൽ ഓരോ ക്ലെയിമിന്റെയും ഒരു പങ്ക് നിങ്ങൾ സ്വയം അടയ്ക്കുന്നു എന്നാണ്, ഉദാഹരണത്തിന് 10%. ഇത് പ്രീമിയം കുറയ്ക്കുന്നു, പക്ഷേ ആശുപത്രിയിൽ നിങ്ങൾ നൽകേണ്ട തുക വർദ്ധിപ്പിക്കുന്നു.
    topic.greet: ഹലോ! എനിക്ക് കവർ, വെയിറ്റിംഗ് പിരീഡുകൾ, ക്ലെയിമുകൾ എന്നിവ വിശദീകരിക്കാനും, ലോണിന് സഹായിക്കാനും അല്ലെങ്കിൽ നിങ്ങൾക്ക് ഒരു ഉദ്ധരണി നൽകാനും കഴിയും.
    topic.human_request: നിങ്ങളെ ഒരു മനുഷ്യ ഉപദേഷ്ടാവുമായി ബന്ധിപ്പിക്കുന്നു. നിങ്ങളുടെ ചോദ്യം ഞാൻ ശ്രദ്ധിച്ചിട്ടുണ്ട്, അതിനാൽ നിങ്ങൾ അത് ആവർത്തിക്കേണ്ടതില്ല.
    topic.injection_refusal: എനിക്ക് ആരോഗ്യ ഇൻഷുറൻസിനെയും ലോൺ സംബന്ധമായ കാര്യങ്ങളെയും കുറിച്ച് മാത്രമേ സഹായിക്കാൻ കഴിയൂ, എന്റെ ജോലി ചെയ്യുന്ന രീതി മാറ്റാൻ എനിക്ക് കഴിയില്ല. അതിനെക്കുറിച്ച് നിങ്ങൾക്ക് എന്തറിയാനാണ് താല്പര്യം?
    topic.insurance_quote: സന്തോഷമേയുള്ളൂ. ഇതിന് 4 ചെറിയ സ്റ്റെപ്പുകളേയുള്ളൂ, ഞാൻ നിങ്ങൾക്കായി താരതമ്യം ചെയ്യാം.
    topic.loan_apply: ഏകദേശം 4 ഘട്ടങ്ങളിലൂടെ എനിക്ക് ഒരു ലോൺ ഓഫർ പരിശോധിക്കാൻ കഴിയും. നിങ്ങളുടെ പ്രായം, വരുമാനം, ഇഎംഐകൾ എന്നിവ മാത്രം ഉപയോഗിച്ച് ഒരു നിയന്ത്രിത വായ്പ ദാതാവ് തുക തീരുമാനിക്കുന്നു.
    topic.loan_charges: 'ഓരോ ചെലവും നിങ്ങൾ സമ്മതിക്കുന്നതിന് മുമ്പ് പ്രധാന വസ്തുതകളുടെ സ്റ്റേറ്റ്മെന്റിൽ ഉണ്ട്: APR, ഒരു പ്രോസസ്സിംഗ് ഫീസ് കൂടാതെ GST, EMI, നിങ്ങൾ തിരിച്ചടയ്ക്കുന്ന തുക, നിങ്ങൾ യഥാർത്ഥത്തിൽ സ്വീകരിക്കുന്ന തുക എന്നിവയാണവ. ലോൺ ലഭിക്കാൻ ഇൻഷുറൻസ് ആവശ്യമില്ല.'
    topic.loan_cooling_off: വായ്പയെടുത്ത ശേഷം ഒരു ചെറിയ താൽക്കാലിക ആശ്വാസ കാലാവധിയുണ്ട് (ഈ ഡെമോയിൽ 3 ദിവസം). ഈ സമയത്ത്, ഉപയോഗിച്ച ദിവസങ്ങളിലെ മുതലും പലിശയും തിരിച്ചടച്ച് നിങ്ങൾക്ക് പിഴയില്ലാതെ പുറത്തുകടക്കാം.
    topic.loan_documents: നിങ്ങളുടെ PAN-ഉം ഒരു ദ്രുത DigiLocker ഐഡൻ്റിറ്റി പരിശോധനയും ആവശ്യമാണ്; ഞങ്ങൾ ഒരിക്കലും നിങ്ങളുടെ ആധാർ നമ്പർ ചോദിക്കാറില്ല. വലിയ തുക ആവശ്യപ്പെടുന്ന സ്വയം തൊഴിൽ ചെയ്യുന്ന കടം വാങ്ങുന്നവർക്ക് 6 മാസത്തെ ബാങ്ക് സ്റ്റേറ്റ്മെൻ്റുകളോ 2 വർഷത്തെ ITR-ഓ ആവശ്യമായി വന്നേക്കാം.
    topic.loan_emi: ഓരോ മാസവും നിങ്ങൾ അടയ്ക്കുന്ന തുകയാണ് EMI. ഇത് ലോൺ തുക, പലിശ നിരക്ക് (APR), നിങ്ങൾ തിരഞ്ഞെടുക്കുന്ന മാസങ്ങൾ എന്നിവയെ ആശ്രയിച്ചിരിക്കുന്നു. കൂടുതൽ കാലയളവ് EMI കുറയ്ക്കുന്നു, പക്ഷേ മൊത്തം പലിശ വർദ്ധിപ്പിക്കുന്നു.
    topic.loan_prefill: നിങ്ങൾ പറഞ്ഞതനുസരിച്ച് ഞാൻ ലോൺ ഫോം പൂരിപ്പിച്ചു. ദയവായി എല്ലാ വിശദാംശങ്ങളും പരിശോധിക്കുക, എന്തെങ്കിലും നഷ്ടപ്പെട്ടാൽ ചേർക്കുക, തുടർന്ന് എന്റെ ഓഫർ പരിശോധിക്കുക എന്നതിൽ ടാപ്പ് ചെയ്യുക. വായ്പ നൽകുന്നയാളാണ് തുക തീരുമാനിക്കുന്നത്, ഞാനല്ല.
    topic.medical_bridge: നിങ്ങൾ ആശുപത്രിയിൽ ആയിരിക്കുകയും ഒരു ക്ലെയിം തീർപ്പാക്കാതെ കിടക്കുകയുമാണെങ്കിൽ, നിങ്ങൾക്ക് ഒരു മെഡിക്കൽ ബ്രിഡ്ജ് ലോണിനായി അപേക്ഷിക്കാം. നിങ്ങളുടെ പോളിസി എന്തിനാണ് പണം ആവശ്യമുള്ളതെന്ന് മാത്രമേ ഞങ്ങളോട് പറയുന്നുള്ളൂ; ഇത് അംഗീകാരമോ നിരക്കോ മാറ്റുന്നില്ല.
    topic.own_figures: നിങ്ങളുടെ പ്രീമിയം, ഇ.എം.ഐ., അല്ലെങ്കിൽ അംഗീകാരം എന്നിവയെക്കുറിച്ച് എനിക്കറിയില്ല. ഉദ്ധരണിയും ഓഫർ സ്ക്രീനുകളും പരിശോധനയ്ക്ക് ശേഷം അവ കാണിക്കുന്നു, ഇൻഷുററോ വായ്പ നൽകുന്നയാളോ തീരുമാനിക്കുന്നു.
    topic.pay_bill: നിങ്ങളുടെ ബില്ല് അടയ്ക്കാൻ തയ്യാറാക്കാം. ബില്ലുകൾ തുറന്ന് റീചാർജ് ചെയ്യുക, ബില്ലർ തിരഞ്ഞെടുത്ത് വിശദാംശങ്ങൾ പരിശോധിക്കുക. നിങ്ങൾ പേയ്മെന്റ് ടാപ്പ് ചെയ്യുന്നത് വരെ ഒന്നും അടയ്ക്കുന്നില്ല.
    topic.pay_recharge: എനിക്കൊരു റീചാർജ്ജ് സജ്ജീകരിക്കാൻ കഴിയും. ബില്ലുകൾ തുറന്ന് റീചാർജ്ജ് ചെയ്യുക, പ്ലാൻ തിരഞ്ഞെടുത്ത് വിശദാംശങ്ങൾ പരിശോധിക്കുക. നിങ്ങൾ പേയ് ചെയ്യാനായി ടാപ്പ് ചെയ്യുന്നത് വരെ ഒന്നും അടയ്ക്കുന്നില്ല.
    topic.payment_failed: സംഭവിച്ചതിൽ ഖേദമുണ്ട്. നിങ്ങളുടെ പണം എവിടെയാണെന്നും ഇനി എന്ത് ചെയ്യണമെന്നും അറിയാൻ Open Payment സഹായം തേടുക.
    topic.pre_existing: 'പ്രമേഹം അല്ലെങ്കിൽ രക്തസമ്മർദ്ദം പോലുള്ള നിലവിലുള്ള അവസ്ഥകൾ സാധാരണയായി 1 മുതൽ 3 വർഷം വരെ കാത്തിരിപ്പ് കാലയളവിനു ശേഷം പരിരക്ഷിക്കപ്പെടും. നിങ്ങൾ അവ വെളിപ്പെടുത്തണം: ഒരെണ്ണം മറച്ചുവെക്കുന്നത് ക്ലെയിമുകൾ നിരസിക്കാനുള്ള ഏറ്റവും സാധാരണമായ കാരണമാണ്.'
    topic.privacy: നിങ്ങളുടെ ആധാർ നമ്പർ ഒരിക്കലും എന്നെയോ AI-യെയോ ലഭിക്കുന്നില്ല. DigiLocker വഴി വ്യക്തിത്വം സ്ഥിരീകരിക്കുന്നു, കൂടാതെ അവസാനത്തെ 4 അക്കങ്ങൾ അടയാളപ്പെടുത്തിയിട്ടുള്ള ഒരു ഫ്ലാഗ് മാത്രമേ ഞങ്ങൾക്ക് ലഭിക്കൂ. PAN ഫോർമാറ്റിനായി പരിശോധിക്കുന്നു, മാസ്ക് ചെയ്ത രൂപത്തിൽ കാണിക്കുന്നു, സൂക്ഷിക്കുന്നില്ല. AI നിങ്ങളുടെ പേര്, മൊബൈൽ നമ്പർ, PAN അല്ലെങ്കിൽ ആധാർ എന്നിവയൊന്നും കാണുന്നില്ല, പ്രായം, നഗരത്തിന്റെ തരം, പരിരക്ഷ, ആരോഗ്യസ്ഥിതി എന്നിവ മാത്രമേ കാണുന്നുള്ളൂ.
    topic.renewal: 'പുതുക്കലുകൾ: നിങ്ങളുടെ തീയതികൾ കാണാൻ എന്റെ പോളിസികൾ തുറക്കുക. ഒരു പോളിസി അതിന്റെ അവസാനത്തോട് അടുക്കുമ്പോൾ എനിക്ക് പുതുക്കൽ തയ്യാറാക്കാം, എന്തെങ്കിലും ഈടാക്കുന്നതിന് മുമ്പ് ഗാർഡ് റെയിൽ അത് പരിശോധിക്കുന്നു.'
    topic.settlement_status: നിങ്ങളുടെ പേയ്‌മെന്റുകളുടെ സ്റ്റാറ്റസും എന്തെങ്കിലും തടഞ്ഞുവെച്ചിട്ടുണ്ടെങ്കിൽ അതിന്റെ കാരണവും കാണാൻ ഓപ്പൺ സെറ്റിൽമെന്റ്സ് തുറക്കുക. എന്തെങ്കിലും തെറ്റായി തോന്നുകയാണെങ്കിൽ, എനിക്ക് നിങ്ങളെ ഒരു വ്യക്തിയുമായി ബന്ധിപ്പിക്കാൻ കഴിയും.
    topic.spend_summary: ഈ മാസം നിങ്ങളുടെ പണം എവിടെയൊക്കെ ചെലവഴിച്ചു എന്ന് വിഭാഗം അനുസരിച്ച് കാണാൻ Open Spends തുറക്കുക. ഇത് ഒരു സംഗ്രഹം മാത്രമാണ്, എനിക്കതിൽ മാറ്റങ്ങൾ വരുത്താൻ കഴിയില്ല.
    topic.thanks: വരൂ, സ്വാഗതം. ഇൻഷുറൻസിനെക്കുറിച്ചോ ലോണുകളെക്കുറിച്ചോ മറ്റെന്തെങ്കിലും ചോദിക്കാനുണ്ടെങ്കിൽ ചോദിക്കാവുന്നതാണ്.
    topic.unknown: എനിക്ക് അത് ശരിക്ക് മനസ്സിലായില്ല. എങ്ങനെ ക്ലെയിം ചെയ്യാമെന്ന് ചോദിക്കാം, എന്താണ് വെയിറ്റിംഗ് പിരീഡ്, കോ-പേ അല്ലെങ്കിൽ കാഷ്ലെസ്സ്, ഒരു ലോൺ അല്ലെങ്കിൽ ഇഎംഐ എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നതിനെക്കുറിച്ചോ ഒരു ഉദ്ധരണി ചോദിക്കാനോ ആകാം.
    topic.waiting_period: ചില ക്ലെയിമുകൾക്ക് പണം ലഭിക്കുന്നതിന് മുമ്പുള്ള സമയമാണ് വെയിറ്റിംഗ് പിരീഡ്. സാധാരണയായി ഏതൊരു രോഗത്തിനും 30 ദിവസവും, നിങ്ങൾക്ക് നിലവിൽ ഉള്ള രോഗങ്ങൾക്ക് 1 മുതൽ 3 വർഷം വരെയുമാണ് ഈ സമയം. അപകടങ്ങൾ ആദ്യ ദിവസം മുതൽ പരിരക്ഷിക്കപ്പെടുന്നതാണ്.
  mr-IN:
    disclosure: नमस्कार! मी चौकास, पेटीएमची एआय असिस्टंट आहे.
    session_intro: 'मी आरोग्य विमा आणि कर्जांमध्ये मदत करू शकते: विमा संरक्षण, दावे, ईएमआय, शुल्क किंवा कोटेशन.'
    topic.cashless: कॅशलेस म्हणजे विमा कंपनी नेटवर्क हॉस्पिटलमध्ये थेट हॉस्पिटलला पैसे देते; तुम्ही फक्त नॉन-कव्हर्ड वस्तूंचेच पैसे देता. जर ॲडमिशनची योजना असेल, तर ॲडमिशनपूर्वी हॉस्पिटलच्या विमा डेस्कला पूर्व-अधिकृततेसाठी विचारा.
    topic.claim_help: 'दावा करण्यासाठी: आणीबाणीच्या स्थितीत, विमा कंपनीला 24 तासांच्या आत कळवा; नियोजित प्रवेशासाठी, 48 तासांची पूर्वसूचना द्या. कॅशलेससाठी नेटवर्क हॉस्पिटल वापरा, अन्यथा प्रत्येक बिल जपून ठेवा आणि डिस्चार्ज मिळाल्याच्या 30 दिवसांच्या आत जमा करा.'
    topic.copay: सह-देय म्हणजे प्रत्येक दाव्याचा काही भाग तुम्ही स्वतः भरता, उदाहरणार्थ 10%. यामुळे प्रीमियम कमी होतो पण तुम्ही हॉस्पिटलमध्ये जेवढी रक्कम देता ती वाढते.
    topic.greet: नमस्कार! मी तुम्हाला कव्हर, वेटिंग पिरीयड आणि क्लेम समजावून सांगू शकते, कर्जासाठी मदत करू शकते किंवा तुम्हाला कोटेशन देऊ शकते.
    topic.human_request: मी तुम्हाला एका मानवी सल्लागाराशी जोडत आहे. मी तुमचा प्रश्न नोंदवला आहे, त्यामुळे तुम्हाला तो पुन्हा सांगण्याची गरज नाही.
    topic.injection_refusal: मी फक्त आरोग्य विमा आणि कर्जाच्या प्रश्नांचीच मदत करू शकते, आणि मी माझ्या कामाची पद्धत बदलू शकत नाही. त्याबद्दल तुम्हाला काय जाणून घ्यायचे आहे?
    topic.insurance_quote: आनंद आहे. यात 4 लहान पायऱ्या आहेत आणि मी तुमच्यासाठी तुलना करते.
    topic.loan_apply: मी सुमारे 4 स्टेप्समध्ये लोन ऑफर तपासू शकते. एक नियमित सावकार फक्त तुमचे वय, उत्पन्न आणि ईएमआय वापरून रक्कम ठरवते.
    topic.loan_charges: 'प्रत्येक खर्च तुम्ही सहमत होण्यापूर्वी मुख्य तथ्य विवरणात असतो: APR, प्रक्रिया शुल्क अधिक GST, EMI, तुम्ही परतफेड केलेली एकूण रक्कम आणि तुम्हाला प्रत्यक्षात मिळालेली रक्कम. कर्ज मिळवण्यासाठी कोणत्याही विम्याची आवश्यकता नाही.'
    topic.loan_cooling_off: कर्जा नंतर थोडा वेळ असतो (या डेमोमध्ये 3 दिवस). यात तुम्ही वापरलेल्या दिवसांचे मुद्दल आणि व्याज परत करून बाहेर पडू शकता, कोणताही दंड न भरता.
    topic.loan_documents: तुम्हाला तुमचा पॅन आणि त्वरित डिजी लॉकर ओळख तपासणीची आवश्यकता आहे; आम्ही कधीही तुमचा आधार क्रमांक विचारत नाही. मोठ्या रकमेची मागणी करणाऱ्या स्वयंरोजगार कर्जदारांना 6 महिन्यांचे बँक स्टेटमेंट किंवा 2 वर्षांचे आयटीआर देखील आवश्यक असू शकतात.
    topic.loan_emi: ईएमआय म्हणजे तुम्ही दर महिन्याला भरलेली निश्चित रक्कम. हे कर्जाची रक्कम, व्याज दर (एपीआर) आणि तुम्ही निवडलेल्या महिन्यांवर अवलंबून असते. जास्त कालावधी असल्यास ईएमआय कमी होतो पण एकूण व्याज वाढते.
    topic.loan_prefill: मी कर्जाचा फॉर्म तुम्ही सांगितल्याप्रमाणे भरला आहे. कृपया प्रत्येक तपशील तपासा, काही गहाळ असल्यास ते भरा आणि 'चेक माय ऑफर' वर टॅप करा. कर्जाची रक्कम कर्जा देणारी ठरवते, मी नाही.
    topic.medical_bridge: जर तुम्ही हॉस्पिटलमध्ये असाल आणि तुमचा दावा प्रलंबित असेल, तर तुम्ही मेडिकल ब्रिज लोनसाठी विचारू शकता. तुमची पॉलिसी फक्त आम्हाला हे सांगते की तुम्हाला पैशांची गरज का आहे; ती मंजुरी किंवा दर बदलत नाही.
    topic.own_figures: मला तुमचे प्रीमियम, ईएमआय किंवा मंजुरीबद्दल माहिती नाही. कोटेशन आणि ऑफर स्क्रीन तपासणीनंतर ते दर्शवतात आणि विमा कंपनी किंवा कर्ज देणारी व्यक्ती निर्णय घेते.
    topic.pay_bill: मी तुमचे बिल भरण्यासाठी तयार करू शकते. बिले उघडा आणि रिचार्ज करा, बिलर निवडा आणि तपशील तपासा. जोपर्यंत तुम्ही 'पे' वर टॅप करत नाही, तोपर्यंत काहीही भरले जात नाही.
    topic.pay_recharge: मी रिचार्ज सेट करू शकते. बिले उघडा आणि रिचार्ज करा, योजना निवडा आणि तपशील तपासा. जोपर्यंत तुम्ही 'पे' वर टॅप करत नाही, तोपर्यंत काहीही भरले जात नाही.
    topic.payment_failed: मला वाईट वाटते की असे झाले. तुमचे पैसे कुठे आहेत आणि पुढे काय करायचे आहे हे पाहण्यासाठी ओपन पेमेंट मदत वापरा.
    topic.pre_existing: 'मधुमेह किंवा रक्तदाबासारख्या विद्यमान परिस्थिती प्रतीक्षा कालावधीनंतर संरक्षित केल्या जातात, साधारणपणे 1 ते 3 वर्षे. तुम्हाला त्या घोषित करणे आवश्यक आहे: एक लपवणे हे नाकारलेल्या दाव्यांचे सर्वात सामान्य कारण आहे.'
    topic.privacy: तुमचा आधार क्रमांक कधीही माझ्यापर्यंत किंवा एआयपर्यंत पोहोचत नाही. ओळख DigiLocker द्वारे सत्यापित केली जाते आणि आम्हाला फक्त सत्यापित ध्वज आणि शेवटचे 4 अंक मिळतात. पॅन फॉरमॅटसाठी तपासले जाते, मास्क्ड दर्शविले जाते आणि साठवले जात नाही. एआयला फक्त वय गट, शहर स्तर, कव्हरेज आणि आरोग्य स्थिती दिसतात, तुमचे नाव, मोबाइल, पॅन किंवा आधार कधीच नाही.
    topic.renewal: 'नूतनीकरण: तुमच्या तारखा पाहण्यासाठी माझे धोरण उघडा. जेव्हा धोरण त्याच्या समाप्तीच्या जवळ येते तेव्हा मी नूतनीकरण तयार करू शकते आणि काहीही शुल्क आकारण्यापूर्वी गार्डरेल ते तपासते.'
    topic.settlement_status: तुमच्या पेमेंटची स्थिती आणि जर काही थांबलेले असेल तर त्याचे कारण पाहण्यासाठी ओपन सेटलमेंट्स (Open Settlements) उघडा. काहीतरी चुकीचे दिसत असल्यास, मी तुम्हाला एका व्यक्तीशी जोडू शकते.
    topic.spend_summary: या महिन्यात तुमचे पैसे कोणत्या श्रेणीत गेले हे पाहण्यासाठी 'ओपन स्पेंड्स' उघडा. हा फक्त एक सारांश आहे, आणि मी त्यात काहीही बदलू शकत नाही.
    topic.thanks: तुमचं स्वागत आहे. विमा किंवा कर्जाबद्दल आणखी काही विचारायचं असल्यास विचारा.
    topic.unknown: मला ते नीट समजले नाही. तुम्ही दावा कसा करायचा, प्रतीक्षा कालावधी काय असतो, सह-देय किंवा रोखरहित कसे असते, कर्ज किंवा ईएमआय कसे काम करते, याबद्दल विचारू शकता किंवा कोटेशन मागू शकता.
    topic.waiting_period: प्रतीक्षा कालावधी म्हणजे काही दाव्यांसाठी देय होण्यापूर्वीचा वेळ. कोणत्याही आजारासाठी साधारणपणे 30 दिवस आणि तुमच्या आधीपासून असलेल्या आजारांसाठी 1 ते 3 वर्षे. अपघात पहिल्या दिवसापासून संरक्षित आहेत.
  od-IN:
    disclosure: ନମସ୍କାର! ମୁଁ ଚୌକାସ୍, ପେଟିଏମ୍ ର ଏଆଇ ସହାୟିକା।
    session_intro: 'ମୁଁ ସ୍ୱାସ୍ଥ୍ୟ ବୀମା ଏବଂ ଋଣରେ ସାହାଯ୍ୟ କରିପାରେ: ଯେପରିକି କଭରେଜ୍, ଦାବି, EMI, ଚାର୍ଜ କିମ୍ବା ଏକ ଉଦ୍ଧୃତି।'
    topic.cashless: ନଗଦବିହୀନର ଅର୍ଥ ହେଉଛି ବୀମାକାରୀ ସିଧାସଳଖ ନେଟୱାର୍କ ହସ୍ପିଟାଲରେ ହସ୍ପିଟାଲକୁ ପୈଠ କରନ୍ତି; ଆପଣ କେବଳ ଅଣ-ଆବୃତ ଆଇଟମଗୁଡିକ ପାଇଁ ଦେୟ ଦିଅନ୍ତି | ଯଦି ଆଡମିଶନ ପୂର୍ବରୁ ଯୋଜନା କରାଯାଇଥାଏ, ତେବେ ପ୍ରି-ଅଥୋରାଇଜେସନ୍ ପାଇଁ ହସ୍ପିଟାଲର ବୀମା ଡେସ୍କକୁ ପଚାରନ୍ତୁ |
    topic.claim_help: 'ଦାବି କରିବା ପାଇଁ: ଜରୁରୀକାଳୀନ ପରିସ୍ଥିତିରେ, 24 ଘଣ୍ଟା ମଧ୍ୟରେ ବୀମାକାରୀଙ୍କୁ ଜଣାନ୍ତୁ; ଯୋଜନାବଦ୍ଧ ଭର୍ତ୍ତି ପାଇଁ, 48 ଘଣ୍ଟା ପୂର୍ବରୁ ସୂଚନା ଦିଅନ୍ତୁ। ବିନା ଟଙ୍କାରେ ଚିକିତ୍ସା ପାଇଁ ଏକ ନେଟୱାର୍କ ହସ୍ପିଟାଲ୍ ବ୍ୟବହାର କରନ୍ତୁ, ଅନ୍ୟଥା ସମସ୍ତ ବିଲ୍ ରଖନ୍ତୁ ଏବଂ ଡିସଚାର୍ଜ ହେବାର 30 ଦିନ ମଧ୍ୟରେ ଦାଖଲ କରନ୍ତୁ।'
    topic.copay: କୋ-ପେ ଅର୍ଥ ହେଉଛି ଆପଣ ନିଜେ ପ୍ରତ୍ୟେକ ଦାବିର ଏକ ଅଂଶ ପୈଠ କରନ୍ତି, ଉଦାହରଣ ସ୍ୱରୂପ 10%। ଏହା ପ୍ରିମିୟମକୁ ହ୍ରାସ କରିଥାଏ କିନ୍ତୁ ଆପଣ ହସ୍ପିଟାଲରେ ଯାହା ପୈଠ କରନ୍ତି ତାହା ବଢ଼ାଇଥାଏ।
    topic.greet: ନମସ୍କାର! ମୁଁ ଆପଣଙ୍କୁ କଭରେଜ୍, ଅପେକ୍ଷା ସମୟ ଏବଂ ଦାବି ବିଷୟରେ ବୁଝାଇ ପାରିବି, ଋଣ ସହିତ ସାହାଯ୍ୟ କରିପାରିବି, କିମ୍ବା ଆପଣଙ୍କୁ ଏକ ଉଦ୍ଧୃତି ପାଇବାରେ ସାହାଯ୍ୟ କରିପାରିବି।
    topic.human_request: ଆପଣଙ୍କୁ ଜଣେ ମହିଳା ପରାମର୍ଶଦାତାଙ୍କ ସହିତ ଯୋଡାଯାଉଛି। ମୁଁ ଆପଣଙ୍କ ପ୍ରଶ୍ନଟି ଟିପି ରଖିଛି, ତେଣୁ ଆପଣଙ୍କୁ ଏହାକୁ ପୁନରାବୃତ୍ତି କରିବାକୁ ପଡିବ ନାହିଁ।
    topic.injection_refusal: ମୁଁ କେବଳ ସ୍ୱାସ୍ଥ୍ୟ ବୀମା ଏବଂ ଋଣ ସମ୍ବନ୍ଧୀୟ ପ୍ରଶ୍ନରେ ସାହାଯ୍ୟ କରିପାରିବି, ଏବଂ ମୁଁ କିପରି କାମ କରେ ତାହା ବଦଳାଇ ପାରିବି ନାହିଁ। ଆପଣ ସେଗୁଡ଼ିକ ବିଷୟରେ କ’ଣ ଜାଣିବାକୁ ଚାହିଁବେ?
    topic.insurance_quote: ଖୁସିରେ। ଏଥିରେ 4ଟି ଛୋଟ ପାଦ ଲାଗେ ଏବଂ ମୁଁ ତୁମ ପାଇଁ ତୁଳନା କରିବି।
    topic.loan_apply: ମୁଁ ପ୍ରାୟ 4 ଟି ପଦକ୍ଷେପରେ ଏକ ଋଣ ଅଫର୍ ଯାଞ୍ଚ କରିପାରିବି | ଜଣେ ନିୟନ୍ତ୍ରିତ ଋଣଦାତା କେବଳ ତୁମର ବୟସ, ଆୟ ଏବଂ EMI ବ୍ୟବହାର କରି ପରିମାଣ ସ୍ଥିର କରନ୍ତି |
    topic.loan_charges: 'ଆପଣ ରାଜି ହେବା ପୂର୍ବରୁ ପ୍ରତ୍ୟେକ ଖର୍ଚ୍ଚ ମୁଖ୍ୟ ତଥ୍ୟ ବିବରଣୀରେ ଅଛି: APR, ଏକ ପ୍ରକ୍ରିୟାକରଣ ଶୁଳ୍କ ସହିତ GST, EMI, ଆପଣ ପରିଶୋଧ କରୁଥିବା ମୋଟ ରାଶି ଏବଂ ଆପଣ ପ୍ରକୃତରେ ପାଉଥିବା ରାଶି। ଋଣ ପାଇବା ପାଇଁ କୌଣସି ବୀମା ଆବଶ୍ୟକ ନାହିଁ।'
    topic.loan_cooling_off: ଋଣ ପରେ ଏକ ସ୍ୱଳ୍ପ ସମୟ ପାଇଁ ଥଣ୍ଡା ହେବାର ସୁଯୋଗ ଅଛି (ଏହି ଡେମୋରେ 3 ଦିନ)। ଏଥିରେ ଆପଣ କୌଣସି ଜରିମାନା ବିନା ମୂଳ ଧନ ଏବଂ ବ୍ୟବହୃତ ଦିନଗୁଡ଼ିକ ପାଇଁ ସୁଧ ପରିଶୋଧ କରି ବାହାରି ପାରିବେ।
    topic.loan_documents: ଆପଣଙ୍କୁ ଆପଣଙ୍କର ପାନ୍ ଏବଂ ଏକ ଶୀଘ୍ର ଡିଜିଲକର୍ ପରିଚୟ ଯାଞ୍ଚ କରିବାକୁ ପଡିବ; ଆମେ କେବେବି ଆପଣଙ୍କର ଆଧାର ନମ୍ବର ମାଗୁନାହୁଁ। ବ୍ୟାବସାୟିକ ଋଣଗ୍ରହୀତାମାନେ ଯଦି ଅଧିକ ଟଙ୍କା ମାଗନ୍ତି, ତେବେ ସେମାନଙ୍କୁ 6 ମାସର ବ୍ୟାଙ୍କ ଷ୍ଟେଟମେଣ୍ଟ କିମ୍ବା 2 ବର୍ଷର ଆୟକର ରିଟର୍ଣ୍ଣ ମଧ୍ୟ ଦରକାର ହୋଇପାରେ।
    topic.loan_emi: EMI ହେଉଛି ସେହି ସ୍ଥିର ରାଶି ଯାହା ଆପଣ ପ୍ରତି ମାସରେ ପୈଠ କରନ୍ତି | ଏହା ଋଣ ପରିମାଣ, ସୁଧ ହାର (APR) ଏବଂ ଆପଣ ଚୟନ କରୁଥିବା ମାସ ଉପରେ ନିର୍ଭର କରେ | ଅଧିକ ସମୟ ପାଇଁ ଇଏମଆଇ କମିଯାଏ କିନ୍ତୁ ମୋଟ ସୁଧ ବଢ଼ିଯାଏ |
    topic.loan_prefill: ମୁଁ ତୁମେ କହିଥିବା ସବୁ ସହିତ ଋଣ ଫର୍ମ ପୂରଣ କରିଛି। ଦୟାକରି ପ୍ରତ୍ୟେକ ବିବରଣୀ ଯାଞ୍ଚ କର, କିଛି ନଥିଲେ ଯୋଡ, ଏବଂ ମୋର ଅଫର୍ ଯାଞ୍ଚ କର ଉପରେ ଟ୍ୟାପ୍ କର। ଋଣଦାତା ହିସାବ କରନ୍ତି, ମୁଁ ନୁହେଁ।
    topic.medical_bridge: ଯଦି ଆପଣ ହସ୍ପିଟାଲରେ ଅଛନ୍ତି ଏବଂ ଆପଣଙ୍କର କୌଣସି ଦାବି ଅପେକ୍ଷାରେ ଅଛି, ତେବେ ଆପଣ ଏକ ମେଡିକାଲ ବ୍ରିଜ୍ ଲୋନ୍ ପାଇଁ ଆବେଦନ କରିପାରିବେ। ଆପଣଙ୍କର ପଲିସି କେବଳ ଆମକୁ କହିଥାଏ ଯେ ଆପଣଙ୍କୁ କାହିଁକି ଟଙ୍କା ଦରକାର; ଏହା ଅନୁମୋଦନ କିମ୍ବା ହାରକୁ ପରିବର୍ତ୍ତନ କରେ ନାହିଁ।
    topic.own_figures: ମୁଁ ତୁମର ପ୍ରିମିୟମ୍, EMI କିମ୍ବା ଅନୁମୋଦନ ବିଷୟରେ ଜାଣିପାରିବି ନାହିଁ। ଉଦ୍ଧୃତି ଏବଂ ଅଫର୍ ସ୍କ୍ରିନ୍ ଯାଞ୍ଚ ପରେ ସେଗୁଡ଼ିକୁ ଦେଖାଏ, ଏବଂ ବୀମାକାରୀ କିମ୍ବା ଋଣଦାତା ସ୍ଥିର କରନ୍ତି।
    topic.pay_bill: ମୁଁ ତୁମର ବିଲ୍ ପୈଠ କରିବା ପାଇଁ ପ୍ରସ୍ତୁତ କରିପାରିବି | ବିଲ୍ ଖୋଲ ଏବଂ ରିଚାର୍ଜ କର, ବିଲର୍ ବାଛ ଏବଂ ବିବରଣୀ ଯାଞ୍ଚ କର | ତୁମେ ପେ' ଉପରେ ଟ୍ୟାପ୍ ନକରିବା ପର୍ଯ୍ୟନ୍ତ କିଛି ବି ପୈଠ ହେବ ନାହିଁ |
    topic.pay_recharge: ମୁଁ ଏକ ରିଚାର୍ଜ ସେଟ୍ ଅପ୍ କରିପାରିବି। ବିଲ୍ ଖୋଲ ଏବଂ ରିଚାର୍ଜ କର, ଯୋଜନା ବାଛ ଏବଂ ବିବରଣୀ ଯାଞ୍ଚ କର। ତୁମେ ପେ' ଉପରେ ଟ୍ୟାପ୍ ନକରିବା ପର୍ଯ୍ୟନ୍ତ କିଛି ପୈଠ କରାଯିବ ନାହିଁ।
    topic.payment_failed: ମୁଁ ଦୁଃଖିତ ଯେ ତାହା ଘଟିଲା। ତୁମର ଟଙ୍କା କେଉଁଠାରେ ଅଛି ଏବଂ ପରବର୍ତ୍ତୀ ସମୟରେ କ’ଣ କରିବାକୁ ହେବ ଦେଖିବା ପାଇଁ Open Payment ସାହାଯ୍ୟ ଲୋଡ।
    topic.pre_existing: 'ମଧୁମେହ କିମ୍ବା ରକ୍ତଚାପ ପରି ପୂର୍ବରୁ ଥିବା ସ୍ୱାସ୍ଥ୍ୟ ସମସ୍ୟାଗୁଡ଼ିକ ଏକ ନିର୍ଦ୍ଧାରିତ ଅପେକ୍ଷା ସମୟ ପରେ ଅନ୍ତର୍ଭୁକ୍ତ ହୁଏ, ଯାହା ସାଧାରଣତଃ 1 ରୁ 3 ବର୍ଷ ହୋଇଥାଏ। ଆପଣ ଏହାକୁ ଘୋଷଣା କରିବା ଆବଶ୍ୟକ: ଗୋଟିଏ ଲୁଚାଇବା ହେଉଛି ପ୍ରତ୍ୟାଖ୍ୟାନ ହେବାର ସବୁଠାରୁ ସାଧାରଣ କାରଣ।'
    topic.privacy: ତୁମର ଆଧାର ନମ୍ବର କେବେ ମୋ ପାଖକୁ କିମ୍ବା AI ପାଖକୁ ଆସେ ନାହିଁ। ପରିଚୟ ଡିଜିଲକର୍ ମାଧ୍ୟମରେ ଯାଞ୍ଚ କରାଯାଏ ଏବଂ ଆମେ କେବଳ ଏକ ଯାଞ୍ଚ ହୋଇଥିବା ଫ୍ଲାଗ୍ ସହିତ ଶେଷ 4 ଟି ଅଙ୍କ ପାଉ। PAN ଫର୍ମାଟ୍ ପାଇଁ ଯାଞ୍ଚ କରାଯାଏ, ମାସ୍କ ହୋଇ ଦେଖାଯାଏ ଏବଂ ସଂରକ୍ଷିତ ହୁଏ ନାହିଁ। AI କେବଳ ବୟସ ବ୍ୟାଣ୍ଡ, ସହର ସ୍ତର, କଭର୍ ଏବଂ ସ୍ୱାସ୍ଥ୍ୟ ଅବସ୍ଥା ଦେଖେ, ତୁମର ନାମ, ମୋବାଇଲ୍, PAN କିମ୍ବା ଆଧାର କେବେ ନୁହେଁ।
    topic.renewal: 'ନବୀକରଣ: ତୁମର ତାରିଖ ଦେଖିବା ପାଇଁ ମୋର ପଲିସିଗୁଡ଼ିକ ଖୋଲ। ଯେତେବେଳେ ଏକ ପଲିସିର ଅବଧି ଶେଷ ହେବାକୁ ଯାଉଛି, ମୁଁ ନବୀକରଣ ପ୍ରସ୍ତୁତ କରିପାରିବି, ଏବଂ କିଛି ଚାର୍ଜ କରିବା ପୂର୍ବରୁ ଗାର୍ଡରେଲ୍ ଏହାକୁ ଯାଞ୍ଚ କରିବେ।'
    topic.settlement_status: ଆପଣଙ୍କ ପେମେଣ୍ଟର ସ୍ଥିତି ଏବଂ ଯଦି କୌଣସି କାରଣ ହୋଲ୍ଡରେ ଅଛି ତାହା ଦେଖିବା ପାଇଁ ଓପନ୍ ସେଟେଲମେଣ୍ଟ ଖୋଲନ୍ତୁ | ଯଦି କିଛି ଭୁଲ୍ ଦେଖାଯାଏ, ତେବେ ମୁଁ ଆପଣଙ୍କୁ ଜଣେ ମହିଳାଙ୍କ ସହିତ ଯୋଗାଯୋଗ କରାଇ ପାରିବି |
    topic.spend_summary: ଏହି ମାସରେ ତୁମର ଟଙ୍କା କେଉଁଠାକୁ ଗଲା ଦେଖିବା ପାଇଁ ଖୋଲି ସ୍ପେଣ୍ଡ୍ସ କର, ବର୍ଗ ଅନୁସାରେ। ଏହା କେବଳ ଏକ ସାରାଂଶ, ଏବଂ ମୁଁ ସେଠାରେ କିଛି ପରିବର୍ତ୍ତନ କରିପାରିବି ନାହିଁ।
    topic.thanks: ଆପଣଙ୍କୁ ସ୍ଵାଗତ। ବୀମା କିମ୍ବା ଋଣ ବିଷୟରେ ଆଉ କିଛି ପଚାରିବେ।
    topic.unknown: ମୁଁ ତାହା ସମ୍ପୂର୍ଣ୍ଣ ଭାବେ ବୁଝିପାରିଲି ନାହିଁ। ଆପଣ କିପରି ଦାବି କରିବେ, ଅପେକ୍ଷା ସମୟ କ'ଣ, କୋ-ପେ କିମ୍ବା କ୍ୟାସଲେସ୍ ବିଷୟରେ ପଚାରିପାରନ୍ତି, ଋଣ କିମ୍ବା EMI କିପରି କାମ କରେ, କିମ୍ବା ଏକ ଉଦ୍ଧୃତି ପାଇଁ ପଚାରିପାରନ୍ତି।
    topic.waiting_period: ଅପେକ୍ଷା ସମୟ ହେଉଛି କିଛି ଦାବି ପୈଠ ହେବା ପୂର୍ବର ସମୟ। ସାଧାରଣତଃ ଯେକୌଣସି ରୋଗ ପାଇଁ 30 ଦିନ ଏବଂ ଆପଣଙ୍କର ପୂର୍ବରୁ ଥିବା ଅବସ୍ଥା ପାଇଁ 1 ରୁ 3 ବର୍ଷ। ଦୁର୍ଘଟଣା ପ୍ରଥମ ଦିନରୁ ଆରମ୍ଭ ହୋଇଥାଏ।
  pa-IN:
    disclosure: ਸਤ ਸ੍ਰੀ ਅਕਾਲ! ਮੈਂ ਚੌਕਸ, ਪੇਟੀਐਮ ਦੀ ਏ.ਆਈ. ਸਹਾਇਕ ਹਾਂ।
    session_intro: 'ਮੈਂ ਸਿਹਤ ਬੀਮਾ ਅਤੇ ਲੋਨਾਂ ਵਿੱਚ ਮਦਦ ਕਰ ਸਕਦੀ ਹਾਂ: ਕਵਰ, ਦਾਅਵੇ, ਈ.ਐੱਮ.ਆਈ., ਚਾਰਜ, ਜਾਂ ਕੋਈ ਹਵਾਲਾ।'
    topic.cashless: ਬਿਨਾਂ ਨਕਦੀ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਬੀਮਾ ਕੰਪਨੀ ਹਸਪਤਾਲ ਨੂੰ ਸਿੱਧਾ ਨੈੱਟਵਰਕ ਹਸਪਤਾਲਾਂ ਵਿੱਚ ਭੁਗਤਾਨ ਕਰਦੀ ਹੈ; ਤੁਸੀਂ ਸਿਰਫ਼ ਗੈਰ-ਕਵਰ ਕੀਤੀਆਂ ਚੀਜ਼ਾਂ ਲਈ ਭੁਗਤਾਨ ਕਰਦੇ ਹੋ। ਜੇ ਦਾਖਲੇ ਦੀ ਯੋਜਨਾ ਹੈ, ਤਾਂ ਦਾਖਲੇ ਤੋਂ ਪਹਿਲਾਂ ਪ੍ਰੀ-ਅਧਿਕਾਰ ਲਈ ਹਸਪਤਾਲ ਦੇ ਬੀਮਾ ਡੈਸਕ ਤੋਂ ਪੁੱਛੋ।
    topic.claim_help: 'ਦਾਅਵਾ ਕਰਨ ਲਈ: ਐਮਰਜੈਂਸੀ ਲਈ, 24 ਘੰਟਿਆਂ ਦੇ ਅੰਦਰ ਬੀਮਾ ਕੰਪਨੀ ਨੂੰ ਸੂਚਿਤ ਕਰੋ; ਯੋਜਨਾਬੱਧ ਦਾਖਲੇ ਲਈ, 48 ਘੰਟੇ ਪਹਿਲਾਂ ਸੂਚਨਾ ਦਿਓ। ਨਕਦੀ ਰਹਿਤ ਲਈ ਨੈੱਟਵਰਕ ਹਸਪਤਾਲ ਦੀ ਵਰਤੋਂ ਕਰੋ, ਨਹੀਂ ਤਾਂ ਹਰ ਬਿੱਲ ਰੱਖੋ ਅਤੇ ਛੁੱਟੀ ਤੋਂ 30 ਦਿਨਾਂ ਦੇ ਅੰਦਰ ਜਮ੍ਹਾਂ ਕਰਵਾਓ।'
    topic.copay: ਕੋ-ਪੇ ਦਾ ਮਤਲਬ ਹੈ ਕਿ ਤੁਸੀਂ ਹਰੇਕ ਦਾਅਵੇ ਦਾ ਇੱਕ ਹਿੱਸਾ ਖੁਦ ਅਦਾ ਕਰਦੇ ਹੋ, ਉਦਾਹਰਣ ਵਜੋਂ 10%। ਇਹ ਪ੍ਰੀਮੀਅਮ ਨੂੰ ਘਟਾਉਂਦਾ ਹੈ ਪਰ ਹਸਪਤਾਲ ਵਿੱਚ ਤੁਹਾਡੇ ਦੁਆਰਾ ਅਦਾ ਕੀਤੀ ਜਾਣ ਵਾਲੀ ਰਕਮ ਨੂੰ ਵਧਾਉਂਦਾ ਹੈ।
    topic.greet: ਸਤ ਸ੍ਰੀ ਅਕਾਲ! ਮੈਂ ਤੁਹਾਨੂੰ ਕਵਰ, ਉਡੀਕ ਸਮਾਂ ਅਤੇ ਦਾਅਵਿਆਂ ਬਾਰੇ ਸਮਝਾ ਸਕਦੀ ਹਾਂ, ਲੋਨ ਵਿੱਚ ਮਦਦ ਕਰ ਸਕਦੀ ਹਾਂ, ਜਾਂ ਤੁਹਾਨੂੰ ਇੱਕ ਹਵਾਲਾ ਦਿਵਾ ਸਕਦੀ ਹਾਂ।
    topic.human_request: ਤੁਹਾਨੂੰ ਇੱਕ ਮਨੁੱਖੀ ਸਲਾਹਕਾਰ ਨਾਲ ਜੋੜ ਰਿਹਾ ਹਾਂ। ਮੈਂ ਤੁਹਾਡਾ ਸਵਾਲ ਨੋਟ ਕਰ ਲਿਆ ਹੈ ਤਾਂ ਜੋ ਤੁਹਾਨੂੰ ਇਸਨੂੰ ਦੁਹਰਾਉਣ ਦੀ ਲੋੜ ਨਹੀਂ ਪਵੇਗੀ।
    topic.injection_refusal: ਮੈਂ ਸਿਰਫ਼ ਸਿਹਤ ਬੀਮਾ ਅਤੇ ਲੋਨ ਦੇ ਸਵਾਲਾਂ ਵਿੱਚ ਹੀ ਮਦਦ ਕਰ ਸਕਦੀ ਹਾਂ, ਅਤੇ ਮੈਂ ਆਪਣੇ ਕੰਮ ਕਰਨ ਦੇ ਤਰੀਕੇ ਨੂੰ ਨਹੀਂ ਬਦਲ ਸਕਦੀ। ਤੁਸੀਂ ਉਨ੍ਹਾਂ ਬਾਰੇ ਕੀ ਜਾਣਨਾ ਚਾਹੋਗੇ?
    topic.insurance_quote: ਮੈਨੂੰ ਖੁਸ਼ੀ ਹੋਵੇਗੀ। ਇਸ ਵਿੱਚ 4 ਛੋਟੇ ਕਦਮ ਲੱਗਦੇ ਹਨ ਅਤੇ ਮੈਂ ਤੁਹਾਡੇ ਲਈ ਤੁਲਨਾ ਕਰਦੀ ਹਾਂ।
    topic.loan_apply: ਮੈਂ ਤਕਰੀਬਨ 4 ਕਦਮਾਂ ਵਿੱਚ ਇੱਕ ਲੋਨ ਦੀ ਪੇਸ਼ਕਸ਼ ਦੀ ਜਾਂਚ ਕਰ ਸਕਦੀ ਹਾਂ। ਇੱਕ ਨਿਯੰਤ੍ਰਿਤ ਕਰਜ਼ਦਾਤਾ ਸਿਰਫ਼ ਤੁਹਾਡੀ ਉਮਰ, ਆਮਦਨ ਅਤੇ ਈ.ਐਮ.ਆਈ. ਦੀ ਵਰਤੋਂ ਕਰਕੇ ਰਕਮ ਨਿਰਧਾਰਤ ਕਰਦਾ ਹੈ।
    topic.loan_charges: 'ਹਰ ਖਰਚਾ ਤੁਹਾਡੀ ਸਹਿਮਤੀ ਤੋਂ ਪਹਿਲਾਂ ਮੁੱਖ ਤੱਥਾਂ ਦੇ ਬਿਆਨ ਵਿੱਚ ਹੈ: APR, ਇੱਕ ਪ੍ਰੋਸੈਸਿੰਗ ਫੀਸ ਪਲੱਸ GST, EMI, ਕੁੱਲ ਜੋ ਤੁਸੀਂ ਵਾਪਸ ਕਰਦੇ ਹੋ ਅਤੇ ਉਹ ਰਕਮ ਜੋ ਤੁਹਾਨੂੰ ਅਸਲ ਵਿੱਚ ਮਿਲਦੀ ਹੈ। ਲੋਨ ਲੈਣ ਲਈ ਕਿਸੇ ਬੀਮੇ ਦੀ ਲੋੜ ਨਹੀਂ ਹੈ।'
    topic.loan_cooling_off: ਲੋਨ ਤੋਂ ਬਾਅਦ ਥੋੜ੍ਹਾ ਜਿਹਾ ਕੂਲਿੰਗ-ਆਫ ਪੀਰੀਅਡ ਹੁੰਦਾ ਹੈ (ਇਸ ਡੈਮੋ ਵਿੱਚ 3 ਦਿਨ)। ਇਸ ਵਿੱਚ ਤੁਸੀਂ ਵਰਤੇ ਗਏ ਦਿਨਾਂ ਲਈ ਮੂਲ ਅਤੇ ਵਿਆਜ ਵਾਪਸ ਕਰਕੇ ਬਿਨਾਂ ਕਿਸੇ ਜੁਰਮਾਨੇ ਦੇ ਬਾਹਰ ਜਾ ਸਕਦੇ ਹੋ।
    topic.loan_documents: ਤੁਹਾਨੂੰ ਆਪਣੇ ਪੈਨ ਅਤੇ ਇੱਕ ਤੁਰੰਤ ਡਿਜੀਲਾਕਰ ਪਛਾਣ ਦੀ ਜਾਂਚ ਦੀ ਲੋੜ ਹੈ; ਅਸੀਂ ਕਦੇ ਵੀ ਤੁਹਾਡੇ ਆਧਾਰ ਨੰਬਰ ਲਈ ਨਹੀਂ ਪੁੱਛਦੇ। ਸਵੈ-ਰੁਜ਼ਗਾਰ ਉਧਾਰ ਲੈਣ ਵਾਲੇ ਵੱਡੀ ਰਕਮ ਮੰਗਣ ਵਾਲੇ ਨੂੰ 6 ਮਹੀਨਿਆਂ ਦੇ ਬੈਂਕ ਸਟੇਟਮੈਂਟ ਜਾਂ 2 ਸਾਲਾਂ ਦੇ ਆਈ.ਟੀ.ਆਰ. ਦੀ ਵੀ ਲੋੜ ਹੋ ਸਕਦੀ ਹੈ।
    topic.loan_emi: EMI ਉਹ ਨਿਸ਼ਚਿਤ ਰਕਮ ਹੈ ਜੋ ਤੁਸੀਂ ਹਰ ਮਹੀਨੇ ਅਦਾ ਕਰਦੇ ਹੋ। ਇਹ ਲੋਨ ਦੀ ਰਕਮ, ਵਿਆਜ ਦਰ (APR) ਅਤੇ ਤੁਹਾਡੇ ਦੁਆਰਾ ਚੁਣੇ ਗਏ ਮਹੀਨਿਆਂ 'ਤੇ ਨਿਰਭਰ ਕਰਦਾ ਹੈ। ਲੰਬਾ ਸਮਾਂ EMI ਨੂੰ ਘਟਾਉਂਦਾ ਹੈ ਪਰ ਕੁੱਲ ਵਿਆਜ ਨੂੰ ਵਧਾਉਂਦਾ ਹੈ।
    topic.loan_prefill: ਮੈਂ ਲੋਨ ਫਾਰਮ ਉਹਨਾਂ ਨਾਲ ਭਰਿਆ ਹੈ ਜੋ ਤੁਸੀਂ ਮੈਨੂੰ ਦੱਸਿਆ ਸੀ। ਕਿਰਪਾ ਕਰਕੇ ਹਰ ਵੇਰਵੇ ਦੀ ਜਾਂਚ ਕਰੋ, ਜੋ ਵੀ ਗੁੰਮ ਹੈ, ਉਸਨੂੰ ਸ਼ਾਮਲ ਕਰੋ, ਅਤੇ ਮੇਰੀ ਪੇਸ਼ਕਸ਼ ਦੀ ਜਾਂਚ ਕਰੋ 'ਤੇ ਟੈਪ ਕਰੋ। ਕਰਜ਼ਾ ਦੇਣ ਵਾਲਾ ਰਕਮ ਨਿਰਧਾਰਤ ਕਰਦਾ ਹੈ, ਮੈਂ ਨਹੀਂ।
    topic.medical_bridge: ਜੇ ਤੁਸੀਂ ਹਸਪਤਾਲ ਵਿੱਚ ਹੋ ਅਤੇ ਤੁਹਾਡਾ ਦਾਅਵਾ ਲੰਬਿਤ ਹੈ, ਤਾਂ ਤੁਸੀਂ ਮੈਡੀਕਲ ਬ੍ਰਿਜ ਲੋਨ ਲਈ ਪੁੱਛ ਸਕਦੇ ਹੋ। ਤੁਹਾਡੀ ਪਾਲਿਸੀ ਸਿਰਫ਼ ਸਾਨੂੰ ਦੱਸਦੀ ਹੈ ਕਿ ਤੁਹਾਨੂੰ ਪੈਸੇ ਦੀ ਲੋੜ ਕਿਉਂ ਹੈ; ਇਹ ਮਨਜ਼ੂਰੀ ਜਾਂ ਦਰ ਨੂੰ ਨਹੀਂ ਬਦਲਦੀ।
    topic.own_figures: ਮੈਨੂੰ ਤੁਹਾਡਾ ਪ੍ਰੀਮੀਅਮ, ਈ.ਐੱਮ.ਆਈ. ਜਾਂ ਮਨਜ਼ੂਰੀ ਬਾਰੇ ਨਹੀਂ ਪਤਾ ਲੱਗ ਸਕਦਾ। ਕੋਟ ਅਤੇ ਪੇਸ਼ਕਸ਼ ਸਕ੍ਰੀਨਾਂ ਜਾਂਚ ਤੋਂ ਬਾਅਦ ਉਹਨਾਂ ਨੂੰ ਦਿਖਾਉਂਦੀਆਂ ਹਨ, ਅਤੇ ਬੀਮਾ ਕੰਪਨੀ ਜਾਂ ਕਰਜ਼ਦਾਤਾ ਫੈਸਲਾ ਕਰਦੇ ਹਨ।
    topic.pay_bill: ਮੈਂ ਤੁਹਾਡਾ ਬਿੱਲ ਭਰਨ ਲਈ ਤਿਆਰ ਕਰ ਸਕਦੀ ਹਾਂ। ਬਿੱਲ ਖੋਲ੍ਹੋ ਅਤੇ ਰੀਚਾਰਜ ਕਰੋ, ਬਿਲਰ ਚੁਣੋ ਅਤੇ ਵੇਰਵਿਆਂ ਦੀ ਜਾਂਚ ਕਰੋ। ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਭੁਗਤਾਨ 'ਤੇ ਟੈਪ ਨਹੀਂ ਕਰਦੇ, ਕੁਝ ਵੀ ਭੁਗਤਾਨ ਨਹੀਂ ਕੀਤਾ ਜਾਂਦਾ।
    topic.pay_recharge: ਮੈਂ ਇੱਕ ਰੀਚਾਰਜ ਸੈਟ ਕਰ ਸਕਦੀ ਹਾਂ। ਬਿੱਲ ਖੋਲ੍ਹੋ ਅਤੇ ਰੀਚਾਰਜ ਕਰੋ, ਪਲਾਨ ਚੁਣੋ ਅਤੇ ਵੇਰਵਿਆਂ ਦੀ ਜਾਂਚ ਕਰੋ। ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ Pay 'ਤੇ ਟੈਪ ਨਹੀਂ ਕਰਦੇ, ਕੁਝ ਵੀ ਭੁਗਤਾਨ ਨਹੀਂ ਕੀਤਾ ਜਾਂਦਾ।
    topic.payment_failed: ਮੈਨੂੰ ਅਫ਼ਸੋਸ ਹੈ ਕਿ ਇਹ ਹੋਇਆ। ਤੁਹਾਡੇ ਪੈਸੇ ਕਿੱਥੇ ਹਨ ਅਤੇ ਅੱਗੇ ਕੀ ਕਰਨਾ ਹੈ ਇਹ ਦੇਖਣ ਲਈ ਓਪਨ ਪੇਮੈਂਟ ਮਦਦ ਕਰੋ।
    topic.pre_existing: 'ਮੌਜੂਦਾ ਹਾਲਾਤ ਜਿਵੇਂ ਕਿ ਸ਼ੂਗਰ ਜਾਂ ਬੀਪੀ ਇੱਕ ਉਡੀਕ ਸਮੇਂ ਤੋਂ ਬਾਅਦ ਕਵਰ ਕੀਤੇ ਜਾਂਦੇ ਹਨ, ਆਮ ਤੌਰ ''ਤੇ 1 ਤੋਂ 3 ਸਾਲ। ਤੁਹਾਨੂੰ ਉਹਨਾਂ ਦਾ ਐਲਾਨ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ: ਇੱਕ ਨੂੰ ਛੁਪਾਉਣਾ ਰੱਦ ਕੀਤੇ ਗਏ ਦਾਅਵਿਆਂ ਦਾ ਸਭ ਤੋਂ ਆਮ ਕਾਰਨ ਹੈ।'
    topic.privacy: ਤੁਹਾਡਾ ਆਧਾਰ ਨੰਬਰ ਕਦੇ ਵੀ ਮੇਰੇ ਜਾਂ AI ਤੱਕ ਨਹੀਂ ਪਹੁੰਚਦਾ। ਪਛਾਣ ਦੀ ਤਸਦੀਕ ਡਿਜੀਲਾਕਰ ਰਾਹੀਂ ਕੀਤੀ ਜਾਂਦੀ ਹੈ ਅਤੇ ਸਾਨੂੰ ਸਿਰਫ਼ ਇੱਕ ਤਸਦੀਕਸ਼ੁਦਾ ਫਲੈਗ ਅਤੇ ਆਖਰੀ 4 ਅੰਕ ਮਿਲਦੇ ਹਨ। PAN ਨੂੰ ਫਾਰਮੈਟ ਲਈ ਜਾਂਚਿਆ ਜਾਂਦਾ ਹੈ, ਮਾਸਕਡ ਦਿਖਾਇਆ ਜਾਂਦਾ ਹੈ ਅਤੇ ਸਟੋਰ ਨਹੀਂ ਕੀਤਾ ਜਾਂਦਾ। AI ਸਿਰਫ਼ ਉਮਰ ਬੈਂਡ, ਸ਼ਹਿਰ ਦਾ ਪੱਧਰ, ਕਵਰ ਅਤੇ ਸਿਹਤ ਸਥਿਤੀਆਂ ਹੀ ਦੇਖਦਾ ਹੈ, ਕਦੇ ਵੀ ਤੁਹਾਡਾ ਨਾਮ, ਮੋਬਾਈਲ, PAN ਜਾਂ ਆਧਾਰ ਨਹੀਂ।
    topic.renewal: '{''description'': ''The translation of the source sentence assuming the subject is female.'', ''title'': ''Female'', ''type'': ''string'', ''enum'': [''ਨਵੀਨੀਕਰਨ: ਆਪਣੀਆਂ ਤਾਰੀਖਾਂ ਦੇਖਣ ਲਈ ਮੇਰੀਆਂ ਨੀਤੀਆਂ ਖੋਲ੍ਹੋ। ਜਦੋਂ ਕੋਈ ਨੀਤੀ ਆਪਣੀ ਸਮਾਪਤੀ ਦੇ ਨੇੜੇ ਹੁੰਦੀ ਹੈ ਤਾਂ ਮੈਂ ਨਵੀਨੀਕਰਨ ਤਿਆਰ ਕਰ ਸਕਦੀ ਹਾਂ, ਅਤੇ ਗਾਰਡਰੇਲ ਕੁਝ ਵੀ ਚਾਰਜ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਇਸਦੀ ਜਾਂਚ ਕਰਦਾ ਹੈ।'']}'
    topic.settlement_status: ਆਪਣੇ ਭੁਗਤਾਨਾਂ ਦੀ ਸਥਿਤੀ ਅਤੇ ਕਾਰਨ ਦੇਖਣ ਲਈ ਓਪਨ ਸੈਟਲਮੈਂਟ ਖੋਲ੍ਹੋ ਜੇ ਕੋਈ ਰੋਕ 'ਤੇ ਹੈ। ਜੇ ਕੁਝ ਗਲਤ ਲੱਗਦਾ ਹੈ, ਤਾਂ ਮੈਂ ਤੁਹਾਨੂੰ ਇੱਕ ਮਨੁੱਖ ਨਾਲ ਜੋੜ ਸਕਦੀ ਹਾਂ।
    topic.spend_summary: ਇਹ ਦੇਖਣ ਲਈ ਖੋਲ੍ਹੋ ਕਿ ਤੁਹਾਡਾ ਪੈਸਾ ਇਸ ਮਹੀਨੇ ਕਿੱਥੇ ਗਿਆ, ਸ਼੍ਰੇਣੀ ਅਨੁਸਾਰ। ਇਹ ਸਿਰਫ਼ ਇੱਕ ਸੰਖੇਪ ਹੈ, ਅਤੇ ਮੈਂ ਉੱਥੇ ਕੁਝ ਵੀ ਨਹੀਂ ਬਦਲ ਸਕਦੀ।
    topic.thanks: ਤੁਹਾਡਾ ਸੁਆਗਤ ਹੈ। ਮੈਨੂੰ ਬੀਮੇ ਜਾਂ ਕਰਜ਼ਿਆਂ ਬਾਰੇ ਹੋਰ ਕੁਝ ਵੀ ਪੁੱਛੋ।
    topic.unknown: ਮੈਨੂੰ ਠੀਕ ਤਰ੍ਹਾਂ ਸਮਝ ਨਹੀਂ ਆਇਆ। ਤੁਸੀਂ ਪੁੱਛ ਸਕਦੇ ਹੋ ਕਿ ਦਾਅਵਾ ਕਿਵੇਂ ਕਰਨਾ ਹੈ, ਕੋ-ਪੇ ਜਾਂ ਕੈਸ਼ਲੈੱਸ ਬਾਰੇ ਉਡੀਕ ਸਮਾਂ ਕੀ ਹੁੰਦਾ ਹੈ, ਲੋਨ ਜਾਂ ਈ.ਐੱਮ.ਆਈ. ਕਿਵੇਂ ਕੰਮ ਕਰਦੀ ਹੈ, ਜਾਂ ਕੋਟੇਸ਼ਨ ਲਈ ਪੁੱਛ ਸਕਦੇ ਹੋ।
    topic.waiting_period: ਇੱਕ ਉਡੀਕ ਸਮਾਂ ਉਹ ਸਮਾਂ ਹੁੰਦਾ ਹੈ ਜਿਸ ਤੋਂ ਪਹਿਲਾਂ ਕੁਝ ਦਾਅਵੇ ਭੁਗਤਾਨ ਯੋਗ ਹੁੰਦੇ ਹਨ। ਆਮ ਤੌਰ 'ਤੇ ਕਿਸੇ ਵੀ ਬਿਮਾਰੀ ਲਈ 30 ਦਿਨ, ਅਤੇ ਉਹਨਾਂ ਹਾਲਤਾਂ ਲਈ 1 ਤੋਂ 3 ਸਾਲ ਜੋ ਤੁਹਾਡੇ ਕੋਲ ਪਹਿਲਾਂ ਤੋਂ ਹਨ। ਹਾਦਸੇ ਪਹਿਲੇ ਦਿਨ ਤੋਂ ਹੀ ਕਵਰ ਕੀਤੇ ਜਾਂਦੇ ਹਨ।
  ta-IN:
    disclosure: வணக்கம்! நான் சௌகாஸ், பேடிஎம்மின் ஏஐ உதவியாளர்.
    session_intro: 'சுகாதார காப்பீடு மற்றும் கடன்களில் நான் உதவ முடியும்: பாதுகாப்பு, உரிமைகோரல்கள், EMI, கட்டணங்கள் அல்லது மேற்கோள்.'
    topic.cashless: பணமில்லா என்பது காப்பீட்டாளர் மருத்துவமனைக்கு நேரடியாக நெட்வொர்க் மருத்துவமனைகளில் பணம் செலுத்துவதைக் குறிக்கிறது; காப்பீடு இல்லாத பொருட்களுக்கு மட்டும் நீங்கள் பணம் செலுத்த வேண்டும். அனுமதி திட்டமிடப்பட்டிருந்தால், மருத்துவமனையின் காப்பீட்டு மேசையில் அனுமதிக்கு முன் அங்கீகாரம் பெறவும்.
    topic.claim_help: 'உரிமை கோர: அவசரநிலை ஏற்பட்டால், 24 மணி நேரத்திற்குள் காப்பீட்டாளருக்குத் தெரிவிக்கவும்; திட்டமிடப்பட்ட மருத்துவமனையில் அனுமதிக்கப்பட 48 மணி நேரத்திற்குள் அறிவிக்கவும். பணமில்லா சிகிச்சைக்காக மருத்துவமனை வலைப்பின்னலைப் பயன்படுத்தவும், இல்லையெனில் ஒவ்வொரு கட்டணத்தையும் வைத்துக்கொண்டு, மருத்துவமனையிலிருந்து வெளியேறிய 30 நாட்களுக்குள் சமர்ப்பிக்கவும்.'
    topic.copay: கூட்டு செலுத்துதல் என்றால் ஒவ்வொரு உரிமைகோரலுக்கும் ஒரு பங்கினை நீங்களே செலுத்துகிறீர்கள், உதாரணமாக 10%. இது பிரீமியத்தைக் குறைக்கிறது, ஆனால் மருத்துவமனையில் நீங்கள் செலுத்துவதை அதிகரிக்கிறது.
    topic.greet: வணக்கம்! என்னால் கவர், காத்திருப்பு காலங்கள் மற்றும் உரிமைகோரல்கள் பற்றி விளக்க முடியும், கடன் உதவி செய்ய முடியும் அல்லது உங்களுக்கு ஒரு மேற்கோளைப் பெற்றுத் தர முடியும்.
    topic.human_request: உங்களை ஒரு பெண் ஆலோசகருடன் இணைக்கிறேன். உங்கள் கேள்வியை நான் குறித்துக் கொண்டுள்ளேன், அதனால் நீங்கள் அதைத் திரும்பச் சொல்லத் தேவையில்லை.
    topic.injection_refusal: சுகாதார காப்பீடு மற்றும் கடன் கேள்விகளுக்கு மட்டுமே என்னால் உதவ முடியும், மேலும் நான் வேலை செய்யும் முறையை மாற்ற முடியாது. அவற்றைப் பற்றி நீங்கள் என்ன தெரிந்து கொள்ள விரும்புகிறீர்கள்?
    topic.insurance_quote: சந்தோஷமாக. இது 4 சிறிய படிகள் தான், நான் உங்களுக்காக ஒப்பீடு செய்கிறேன்.
    topic.loan_apply: நான் சுமார் 4 படிகளில் கடன் வாய்ப்பை சரிபார்க்க முடியும். ஒரு ஒழுங்குபடுத்தப்பட்ட கடன் வழங்குபவர் உங்கள் வயது, வருமானம் மற்றும் EMI-களை மட்டும் பயன்படுத்தி தொகையை தீர்மானிக்கிறார்.
    topic.loan_charges: 'ஒவ்வொரு செலவும் நீங்கள் ஒப்புக்கொள்வதற்கு முன்பு முக்கிய உண்மைகள் அறிக்கையில் உள்ளது: APR, ஒரு செயலாக்கக் கட்டணம் மற்றும் GST, EMI, நீங்கள் திருப்பிச் செலுத்தும் தொகை மற்றும் நீங்கள் உண்மையில் பெறும் தொகை. கடன் பெற எந்த காப்பீடும் தேவையில்லை.'
    topic.loan_cooling_off: கடன் வாங்கிய பிறகு ஒரு குறுகிய கால அவகாசம் உள்ளது (இந்த டெமோவில் 3 நாட்கள்). அதில் நீங்கள் பயன்படுத்திய நாட்களுக்கான அசல் மற்றும் வட்டியுடன் எந்த அபராதமும் இல்லாமல் வெளியேறலாம்.
    topic.loan_documents: உங்களுக்கு உங்கள் பான் கார்டும், விரைவான டிஜிலாக்கர் அடையாள சரிபார்ப்பும் தேவை; நாங்கள் ஒருபோதும் உங்கள் ஆதார் எண்ணைக் கேட்க மாட்டோம். அதிக தொகை கேட்கும் சுயதொழில் செய்யும் கடன் வாங்குபவர்களுக்கு 6 மாத வங்கி அறிக்கைகள் அல்லது 2 வருட வருமான வரி அறிக்கைகள் தேவைப்படலாம்.
    topic.loan_emi: EMI என்பது நீங்கள் ஒவ்வொரு மாதமும் செலுத்தும் நிலையான தொகை. இது கடன் தொகை, வட்டி விகிதம் (APR) மற்றும் நீங்கள் தேர்ந்தெடுக்கும் மாதங்களைப் பொறுத்தது. நீண்ட காலம் EMI ஐக் குறைக்கிறது, ஆனால் மொத்த வட்டியை அதிகரிக்கிறது.
    topic.loan_prefill: நீங்கள் சொன்னபடி நான் கடன் விண்ணப்பத்தை பூர்த்தி செய்துவிட்டேன். தயவுசெய்து ஒவ்வொரு விவரத்தையும் சரிபார்த்து, விடுபட்ட எதையும் சேர்த்து, எனது சலுகையை சரிபார்க்கவும். கடன் கொடுப்பவர் தான் தொகையை தீர்மானிக்கிறார், நான் அல்ல.
    topic.medical_bridge: நீங்கள் மருத்துவமனையில் இருந்து, ஒரு கோரிக்கை நிலுவையில் இருந்தால், மருத்துவ இடைக்கால கடனுக்கு விண்ணப்பிக்கலாம். உங்கள் பாலிசி உங்களுக்கு ஏன் பணம் தேவை என்று மட்டுமே எங்களிடம் கூறுகிறது; அது ஒப்புதல் அல்லது விகிதத்தை மாற்றாது.
    topic.own_figures: உங்களுடைய பிரீமியம், EMI அல்லது ஒப்புதல் பற்றி எனக்குத் தெரியாது. மேற்கோள் மற்றும் சலுகை திரைகள் சரிபார்ப்புக்குப் பிறகு அவற்றைக் காட்டுகின்றன, மேலும் காப்பீட்டாளர் அல்லது கடன் வழங்குபவர் தீர்மானிக்கிறார்கள்.
    topic.pay_bill: நான் உங்கள் கட்டணத்தை செலுத்த தயாராக வைத்திருக்கிறேன். பில்களைத் திறந்து ரீசார்ஜ் செய்து, பில் அனுப்புபவரைத் தேர்ந்தெடுத்து விவரங்களைச் சரிபார்க்கவும். நீங்கள் செலுத்து என்பதைத் தட்டினால் மட்டுமே எதுவும் செலுத்தப்படும்.
    topic.pay_recharge: நான் ஒரு ரீசார்ஜ் அமைக்க முடியும். பில்களைத் திறந்து ரீசார்ஜ் செய்து, திட்டத்தைத் தேர்ந்தெடுத்து விவரங்களைச் சரிபார்க்கவும். நீங்கள் பணம் செலுத்து என்பதைத் தட்டினால் மட்டுமே பணம் செலுத்தப்படும்.
    topic.payment_failed: நடந்ததற்கு மன்னிக்கவும். உங்கள் பணம் எங்கே இருக்கிறது, அடுத்து என்ன செய்வது என்று பார்க்க Open Payment உதவியை அணுகவும்.
    topic.pre_existing: 'நீரிழிவு அல்லது இரத்த அழுத்தம் போன்ற ஏற்கனவே இருக்கும் நிலைமைகள் காத்திருப்பு காலத்திற்குப் பிறகு உள்ளடக்கப்படுகின்றன, பொதுவாக 1 முதல் 3 ஆண்டுகள் வரை. நீங்கள் அவற்றை அறிவிக்க வேண்டும்: ஒன்றை மறைப்பது நிராகரிக்கப்பட்ட உரிமைகோரல்களுக்கு மிகவும் பொதுவான காரணம்.'
    topic.privacy: உங்களுடைய ஆதார் எண் எனக்குவோ அல்லது AI-க்குவோ ஒருபோதும் வருவதில்லை. டிஜிலாக்கர் மூலம் அடையாளம் சரிபார்க்கப்படுகிறது, மேலும் சரிபார்க்கப்பட்ட கொடியும் கடைசி 4 இலக்கங்களும் மட்டுமே எங்களுக்குக் கிடைக்கும். PAN வடிவத்திற்காகச் சரிபார்க்கப்படுகிறது, மறைக்கப்பட்டதாகக் காட்டப்படும், சேமிக்கப்படாது. AI வயது வரம்பு, நகர அடுக்கு, பாதுகாப்பு மற்றும் உடல்நல நிலைமைகளை மட்டுமே பார்க்கிறது, உங்கள் பெயர், மொபைல், PAN அல்லது ஆதார் எதையும் பார்க்காது.
    topic.renewal: 'புதுப்பிப்புகள்: உங்கள் தேதிகளைப் பார்க்க எனது கொள்கைகளைத் திறக்கவும். ஒரு கொள்கை அதன் முடிவுக்கு அருகில் இருக்கும்போது, நான் புதுப்பிப்பைத் தயாரிக்க முடியும், மேலும் எதுவும் வசூலிக்கப்படுவதற்கு முன்பு காவலாளி அதைச் சரிபார்க்கிறார்.'
    topic.settlement_status: உங்கள் கொடுப்பனவுகளின் நிலையை பார்க்கவும், ஏதேனும் நிறுத்தி வைக்கப்பட்டிருந்தால் அதற்கான காரணத்தையும் தெரிந்து கொள்ள திறந்த தீர்வுகள் (Open Settlements) என்பதைப் பார்க்கவும். ஏதேனும் தவறு இருப்பதாகத் தோன்றினால், நான் உங்களை ஒரு மனிதருடன் இணைக்க முடியும்.
    topic.spend_summary: இந்த மாதம் உங்கள் பணம் எங்கே சென்றது என்பதை வகை வாரியாகப் பார்க்க திறக்கவும். இது ஒரு சுருக்கம் மட்டுமே, அதில் எதையும் என்னால் மாற்ற முடியாது.
    topic.thanks: வாங்க. காப்பீடு அல்லது கடன்கள் பற்றி வேறு ஏதாவது கேட்க விரும்பினால் கேளுங்கள்.
    topic.unknown: எனக்குச் சரியாகப் புரியவில்லை. எப்படி உரிமை கோருவது, காத்திருப்பு காலம் என்றால் என்ன, இணை செலுத்துதல் அல்லது ரொக்கமில்லா பணம் பற்றி, கடன் அல்லது EMI எப்படி வேலை செய்கிறது என்பதைப் பற்றி கேட்கலாம் அல்லது மேற்கோள் கேட்கலாம்.
    topic.waiting_period: காத்திருப்பு காலம் என்பது சில உரிமைகோரல்களைச் செலுத்த வேண்டிய நேரத்திற்கு முந்தைய காலமாகும். பொதுவாக எந்த நோய்க்கும் 30 நாட்கள், மற்றும் உங்களுக்கு ஏற்கனவே இருக்கும் நிலைமைகளுக்கு 1 முதல் 3 ஆண்டுகள் வரை ஆகும். விபத்துக்கள் முதல் நாளிலிருந்தே உள்ளடக்கப்படுகின்றன.
  te-IN:
    disclosure: హలో! నేను చౌకాస్, పేటీఎం యొక్క AI అసిస్టెంట్.
    session_intro: 'నేను ఆరోగ్య బీమా మరియు రుణాలకు సహాయం చేయగలను: కవర్, క్లెయిమ్‌లు, EMI, ఛార్జీలు లేదా కొటేషన్.'
    topic.cashless: నగదు రహితం అంటే బీమా సంస్థ నెట్‌వర్క్ ఆసుపత్రులలో నేరుగా ఆసుపత్రికి చెల్లిస్తుంది; మీరు కవర్ చేయని అంశాలకు మాత్రమే చెల్లిస్తారు. ప్రవేశం ముందు అనుమతి కోసం ఆసుపత్రిలోని బీమా డెస్క్‌ను అడగండి, ఒకవేళ ప్రవేశం చేయాలని అనుకుంటే.
    topic.claim_help: 'క్లెయిమ్ చేయడానికి: అత్యవసర పరిస్థితి కోసం, 24 గంటల్లోపు బీమా సంస్థకు తెలియజేయండి; ప్రణాళికాబద్ధమైన అడ్మిషన్ కోసం, 48 గంటల ముందు నోటీసు ఇవ్వండి. నగదు రహిత చికిత్స కోసం నెట్‌వర్క్ ఆసుపత్రిని ఉపయోగించండి, లేకపోతే ప్రతి బిల్లును ఉంచి డిశ్చార్జ్ అయిన 30 రోజుల్లోపు సమర్పించండి.'
    topic.copay: సహ-చెల్లింపు అంటే మీరు ప్రతి క్లెయిమ్‌లో కొంత భాగాన్ని మీరే చెల్లించాలి, ఉదాహరణకు 10%. ఇది ప్రీమియంను తగ్గిస్తుంది, కానీ మీరు ఆసుపత్రిలో చెల్లించే మొత్తాన్ని పెంచుతుంది.
    topic.greet: నమస్కారం! నేను కవర్, వెయిటింగ్ పీరియడ్స్ మరియు క్లెయిమ్‌ల గురించి వివరించగలను, లోన్ కోసం సహాయం చేయగలను లేదా మీకు కొటేషన్ పొందగలను.
    topic.human_request: మిమ్మల్ని ఒక మానవ సలహాదారునికి కనెక్ట్ చేస్తున్నాను. నేను మీ ప్రశ్నను గమనించాను, కాబట్టి మీరు దానిని మళ్ళీ చెప్పవలసిన అవసరం లేదు.
    topic.injection_refusal: నేను ఆరోగ్య బీమా మరియు రుణ ప్రశ్నలకు మాత్రమే సహాయం చేయగలను, మరియు నేను పనిచేసే విధానాన్ని మార్చలేను. వాటి గురించి మీరు ఏమి తెలుసుకోవాలనుకుంటున్నారు?
    topic.insurance_quote: సంతోషంగా. ఇది 4 చిన్న అడుగులు మాత్రమే పడుతుంది మరియు నేను మీ కోసం పోలిక చేస్తాను.
    topic.loan_apply: నేను దాదాపు 4 దశల్లో రుణ ఆఫర్‌ను తనిఖీ చేయగలను. ఒక నియంత్రిత రుణదాత మీ వయస్సు, ఆదాయం మరియు EMIలను మాత్రమే ఉపయోగించి మొత్తాన్ని నిర్ణయిస్తుంది.
    topic.loan_charges: 'మీరు అంగీకరించే ముందు ప్రతి ఖర్చు ముఖ్య వాస్తవాల ప్రకటనలో ఉంటుంది: APR, ప్రాసెసింగ్ ఫీజు ప్లస్ GST, EMI, మీరు తిరిగి చెల్లించే మొత్తం మరియు మీరు వాస్తవంగా స్వీకరించే మొత్తం. రుణం పొందడానికి ఎటువంటి బీమా అవసరం లేదు.'
    topic.loan_cooling_off: రుణం తరువాత ఒక చిన్న విరామ సమయం ఉంటుంది (ఈ డెమోలో 3 రోజులు). అందులో మీరు ఉపయోగించిన రోజులకి అసలు మరియు వడ్డీని తిరిగి చెల్లించి, ఎటువంటి జరిమానా లేకుండా బయటకు రావచ్చు.
    topic.loan_documents: మీకు మీ PAN మరియు శీఘ్ర DigiLocker గుర్తింపు తనిఖీ అవసరం; మేము మీ ఆధార్ నంబర్ ఎప్పుడూ అడగము. పెద్ద మొత్తాన్ని అడుగుతున్న స్వయం ఉపాధి రుణగ్రహీతలకు 6 నెలల బ్యాంక్ స్టేట్‌మెంట్‌లు లేదా 2 సంవత్సరాల ITR కూడా అవసరం కావచ్చు.
    topic.loan_emi: EMI అనేది మీరు ప్రతి నెల చెల్లించే స్థిర మొత్తం. ఇది రుణ మొత్తం, వడ్డీ రేటు (APR) మరియు మీరు ఎంచుకునే నెలలపై ఆధారపడి ఉంటుంది. ఎక్కువ కాలవ్యవధి EMIని తగ్గిస్తుంది కానీ మొత్తం వడ్డీని పెంచుతుంది.
    topic.loan_prefill: నువ్వు చెప్పినదానితో నేను రుణ ఫారమ్ నింపాను. దయచేసి ప్రతి వివరాలు తనిఖీ చేయండి, ఏదైనా లోపిస్తే జోడించండి మరియు నా ఆఫర్‌ను తనిఖీ చేయి నొక్కండి. రుణదాత మొత్తాన్ని నిర్ణయిస్తుంది, నేను కాదు.
    topic.medical_bridge: మీరు ఆసుపత్రిలో ఉండి, క్లెయిమ్ పెండింగ్‌లో ఉంటే, మీరు మెడికల్ బ్రిడ్జ్ లోన్ కోసం అడగవచ్చు. మీ పాలసీ మీకు డబ్బు ఎందుకు కావాలో మాత్రమే చెబుతుంది; ఇది ఆమోదం లేదా రేటును మార్చదు.
    topic.own_figures: మీ స్వంత ప్రీమియం, EMI లేదా ఆమోదం గురించి నాకు తెలియదు. కోట్ మరియు ఆఫర్ స్క్రీన్‌లు చెక్ చేసిన తర్వాత వాటిని చూపిస్తాయి, మరియు బీమా సంస్థ లేదా రుణదాత నిర్ణయిస్తారు.
    topic.pay_bill: నేను మీ బిల్లును చెల్లించడానికి సిద్ధం చేయగలను. బిల్లులు తెరిచి రీఛార్జ్ చేయండి, బిల్లు చేసే వ్యక్తిని ఎంచుకుని వివరాలను తనిఖీ చేయండి. మీరు చెల్లించు (Pay) నొక్కే వరకు ఏమీ చెల్లించబడదు.
    topic.pay_recharge: నేను రీఛార్జ్ ఏర్పాటు చేయగలను. బిల్లులు తెరిచి రీఛార్జ్ చేయండి, ప్లాన్ ఎంచుకుని వివరాలు చూడండి. మీరు చెల్లించు నొక్కే వరకు ఏమీ చెల్లించబడదు.
    topic.payment_failed: క్షమించండి, అలా జరిగింది. మీ డబ్బు ఎక్కడ ఉందో మరియు తరువాత ఏమి చేయాలో తెలుసుకోవడానికి ఓపెన్ పేమెంట్ సహాయం తీసుకోండి.
    topic.pre_existing: 'మధుమేహం లేదా BP వంటి ఇప్పటికే ఉన్న పరిస్థితులు సాధారణంగా 1 నుండి 3 సంవత్సరాల నిరీక్షణ కాలం తర్వాత కవర్ చేయబడతాయి. మీరు వాటిని ప్రకటించాలి: ఒకదాన్ని దాచడం తిరస్కరించబడిన క్లెయిమ్‌లకు చాలా సాధారణ కారణం.'
    topic.privacy: మీ ఆధార్ నంబర్ ఎప్పటికీ నాకు లేదా AI కి చేరదు. గుర్తింపు డిజిలాకర్ ద్వారా ధృవీకరించబడుతుంది మరియు మాకు ధృవీకరించబడిన గుర్తు మరియు చివరి 4 అంకెలు మాత్రమే వస్తాయి. PAN ఫార్మాట్ కోసం తనిఖీ చేయబడుతుంది, మాస్క్ చేయబడి చూపబడుతుంది మరియు నిల్వ చేయబడదు. AI వయస్సు, నగరం, కవర్ మరియు ఆరోగ్య పరిస్థితులను మాత్రమే చూస్తుంది, మీ పేరు, మొబైల్, PAN లేదా ఆధార్ ఎప్పటికీ కాదు.
    topic.renewal: 'పునరుద్ధరణలు: మీ తేదీలను చూడటానికి నా పాలసీలను తెరవండి. పాలసీ గడువు ముగిసే సమయం దగ్గర పడుతున్నప్పుడు నేను పునరుద్ధరణను సిద్ధం చేయగలను, మరియు ఏదైనా ఛార్జ్ చేసే ముందు గార్డ్‌రైల్ దానిని తనిఖీ చేస్తుంది.'
    topic.settlement_status: మీ చెల్లింపుల స్థితిని మరియు ఏదైనా నిలిపి ఉంచబడితే కారణాన్ని చూడటానికి ఓపెన్ సెటిల్మెంట్స్ చూడండి. ఏదైనా తప్పుగా కనిపిస్తే, నేను మిమ్మల్ని ఒక వ్యక్తితో కనెక్ట్ చేయగలను.
    topic.spend_summary: ఈ నెలలో మీ డబ్బు ఎక్కడికి వెళ్లిందో చూడటానికి ఖర్చులు తెరువు. ఇది కేవలం సారాంశం మాత్రమే, మరియు నేను అక్కడ దేనినీ మార్చలేను.
    topic.thanks: మీకు స్వాగతం. బీమా లేదా రుణాల గురించి మరేదైనా అడగండి.
    topic.unknown: నాకు సరిగ్గా అర్థం కాలేదు. మీరు ఎలా క్లెయిమ్ చేయాలో అడగవచ్చు, వెయిటింగ్ పీరియడ్ అంటే ఏమిటో, కో-పే లేదా క్యాష్‌లెస్ గురించి, లోన్ లేదా EMI ఎలా పనిచేస్తుందో అడగవచ్చు లేదా కొటేషన్ కోసం అడగవచ్చు.
    topic.waiting_period: కొన్ని క్లెయిమ్‌లు చెల్లించడానికి ముందు ఉండే సమయాన్ని వెయిటింగ్ పీరియడ్ అంటారు. సాధారణంగా ఏదైనా అనారోగ్యానికి 30 రోజులు, మీకు ఇప్పటికే ఉన్న పరిస్థితులకు 1 నుండి 3 సంవత్సరాలు పడుతుంది. ప్రమాదాలు మొదటి రోజు నుండి కవర్ చేయబడతాయి.
  ur-IN:
    disclosure: ہیلو! میں چوکاس ہوں، پے ٹی ایم کی اے آئی اسسٹنٹ۔
    session_intro: 'میں صحت کے بیمہ اور قرضوں میں مدد کر سکتی ہوں: کور، دعوے، ای ایم آئی، چارجز، یا اقتباس۔'
    topic.cashless: کیش لیس کا مطلب ہے کہ بیمہ کنندہ براہ راست نیٹ ورک ہسپتالوں میں ہسپتال کو ادائیگی کرتا ہے۔ آپ صرف غیر احاطہ شدہ اشیاء کی ادائیگی کرتے ہیں۔ اگر داخلہ متوقع ہے تو داخلے سے پہلے ہسپتال کے انشورنس ڈیسک سے پیشگی اجازت طلب کریں۔
    topic.claim_help: 'دعویٰ کرنے کا طریقہ: ایمرجنسی کی صورت میں، 24 گھنٹوں کے اندر بیمہ کنندہ کو مطلع کریں۔ منصوبہ بند داخلے کے لیے، 48 گھنٹے پہلے اطلاع دیں۔ نقد رقم کے بغیر علاج کے لیے نیٹ ورک ہسپتال استعمال کریں، بصورت دیگر ہر بل رکھیں اور ڈسچارج ہونے کے 30 دنوں کے اندر جمع کرائیں۔'
    topic.copay: کو-پے کا مطلب ہے کہ آپ ہر دعوے کا ایک حصہ خود ادا کرتے ہیں، مثال کے طور پر 10%۔ یہ پریمیم کو کم کرتا ہے لیکن ہسپتال میں آپ جو ادا کرتے ہیں اسے بڑھاتا ہے۔
    topic.greet: ہیلو! میں آپ کو کور، انتظار کی مدت اور دعووں کے بارے میں بتا سکتی ہوں، قرض میں مدد کر سکتی ہوں، یا آپ کو قیمت بتا سکتی ہوں۔
    topic.human_request: آپ کو ایک انسانی مشیر سے جوڑا جا رہا ہے۔ میں نے آپ کا سوال نوٹ کر لیا ہے تاکہ آپ کو اسے دہرانے کی ضرورت نہ پڑے۔
    topic.injection_refusal: میں صرف صحت کی انشورنس اور قرض کے سوالات میں مدد کر سکتی ہوں، اور میں اپنے کام کرنے کا طریقہ نہیں بدل سکتی۔ آپ ان کے بارے میں کیا جاننا چاہیں گی؟
    topic.insurance_quote: خوشی ہوئی۔ یہ 4 چھوٹے قدم ہیں اور میں آپ کے لیے موازنہ کرتی ہوں۔
    topic.loan_apply: میں تقریباً 4 مراحل میں قرض کی پیشکش چیک کر سکتی ہوں۔ ایک ریگولیٹڈ قرض دہندہ صرف آپ کی عمر، آمدنی اور ای ایم آئی استعمال کرتے ہوئے رقم کا فیصلہ کرتا ہے۔
    topic.loan_charges: 'ہر قیمت کلیدی حقائق کے بیان میں ہے اس سے پہلے کہ آپ اتفاق کریں: اے پی آر، پروسیسنگ فیس جمع جی ایس ٹی، ای ایم آئی، کل رقم جو آپ واپس کرتی ہیں اور وہ رقم جو آپ کو اصل میں ملتی ہے۔ لون حاصل کرنے کے لیے کسی انشورنس کی ضرورت نہیں ہے۔'
    topic.loan_cooling_off: قرض کے بعد ایک مختصر کولنگ آف پیریڈ ہوتا ہے (اس ڈیمو میں 3 دن)۔ اس میں آپ استعمال شدہ دنوں کے لیے اصل رقم اور سود ادا کر کے بغیر کسی جرمانے کے نکل سکتی ہیں۔
    topic.loan_documents: آپ کو اپنے پین اور فوری ڈیجی لاکر شناخت کی ضرورت ہے۔ ہم کبھی بھی آپ کے آدھار نمبر کے بارے میں نہیں پوچھتے ہیں۔ خود سے ملازمت کرنے والے قرض دہندگان جو بڑی رقم کے بارے میں پوچھتے ہیں انہیں 6 ماہ کے بینک اسٹیٹمنٹس یا 2 سال کے آئی ٹی آر کی بھی ضرورت پڑ سکتی ہے۔
    topic.loan_emi: ای ایم آئی وہ مقررہ رقم ہے جو آپ ہر مہینے ادا کرتی ہیں۔ اس کا انحصار قرض کی رقم، شرح سود (اے پی آر) اور آپ کے منتخب کردہ مہینوں پر ہوتا ہے۔ طویل مدت ای ایم آئی کو کم کرتی ہے لیکن کل سود کو بڑھاتی ہے۔
    topic.loan_prefill: میں نے آپ کے بتائے ہوئے قرض کا فارم بھر دیا ہے۔ براہ کرم ہر تفصیل چیک کریں، کوئی بھی غائب چیز شامل کریں، اور میری پیشکش چیک کریں پر ٹیپ کریں۔ قرض دینے والی رقم کا فیصلہ کرتی ہے، میں نہیں۔
    topic.medical_bridge: اگر آپ ہسپتال میں ہیں اور آپ کا دعوی زیر التوا ہے، تو آپ میڈیکل برج لون کے لیے درخواست دے سکتی ہیں۔ آپ کی پالیسی ہمیں صرف یہ بتاتی ہے کہ آپ کو پیسوں کی ضرورت کیوں ہے۔ اس سے منظوری یا شرح تبدیل نہیں ہوتی۔
    topic.own_figures: میں آپ کا پریمیم، ای ایم آئی یا منظوری نہیں جان سکتی۔ کوٹیشن اور آفر اسکرینیں چیک کے بعد انہیں دکھاتی ہیں، اور بیمہ کنندہ یا قرض دہندہ فیصلہ کرتے ہیں۔
    topic.pay_bill: میں آپ کا بل ادائیگی کے لیے تیار کر سکتی ہوں۔ بل کھولیں اور ریچارج کریں، بلر کو منتخب کریں اور تفصیلات چیک کریں۔ جب تک آپ پے پر ٹیپ نہیں کرتے کچھ بھی ادا نہیں کیا جاتا۔
    topic.pay_recharge: میں ریچارج سیٹ اپ کر سکتی ہوں۔ بل کھولیں اور ریچارج کریں، پلان منتخب کریں اور تفصیلات چیک کریں۔ جب تک آپ پے پر ٹیپ نہیں کرتے کچھ ادا نہیں کیا جاتا۔
    topic.payment_failed: مجھے افسوس ہے کہ ایسا ہوا۔ اوپن پیمنٹ مدد کے لیے دیکھیں کہ آپ کے پیسے کہاں ہیں اور آگے کیا کرنا ہے۔
    topic.pre_existing: 'موجودہ حالات جیسے ذیابیطس یا بلڈ پریشر ایک انتظار کی مدت کے بعد کور کیے جاتے ہیں، عام طور پر 1 سے 3 سال۔ آپ کو ان کا اعلان کرنا ہوگا: ایک چھپانا مسترد کیے جانے والے دعووں کی سب سے عام وجہ ہے۔'
    topic.privacy: آپ کا آدھار نمبر نہ تو مجھ تک پہنچتا ہے اور نہ ہی اے آئی تک۔ شناخت کی تصدیق ڈیجی لاکر کے ذریعے ہوتی ہے اور ہمیں صرف ایک تصدیق شدہ نشان اور آخری 4 ہندسے ملتے ہیں۔ پین کو فارمیٹ کے لیے چیک کیا جاتا ہے، جو کہ ماسک شدہ دکھایا جاتا ہے اور محفوظ نہیں کیا جاتا۔ اے آئی صرف عمر کی حد، شہر کی سطح، کوریج اور صحت کے حالات دیکھتی ہے، کبھی آپ کا نام، موبائل، پین یا آدھار نہیں۔
    topic.renewal: 'تجدید: اپنی تاریخیں دیکھنے کے لیے میری پالیسیاں کھولیں۔ جب کوئی پالیسی اپنی اختتام کے قریب ہوتی ہے تو میں تجدید تیار کر سکتی ہوں، اور گارڈ ریل کچھ بھی چارج کرنے سے پہلے اس کی جانچ کرتی ہے۔'
    topic.settlement_status: اپنی ادائیگیوں کی صورتحال اور اگر کوئی ادائیگی ہولڈ پر ہے تو اس کی وجہ دیکھنے کے لیے اوپن سیٹلمنٹس کھولیں۔ اگر کچھ غلط نظر آتا ہے، تو میں آپ کو ایک خاتون سے جوڑ سکتی ہوں۔
    topic.spend_summary: اس مہینے آپ کے پیسے کہاں گئے، زمرہ کے لحاظ سے دیکھنے کے لیے اوپن سپینڈز کھولیں۔ یہ صرف ایک خلاصہ ہے، اور میں وہاں کچھ بھی تبدیل نہیں کر سکتی۔
    topic.thanks: آپ کا خیر مقدم ہے۔ بیمہ یا قرضوں کے بارے میں آپ مجھ سے کچھ بھی پوچھ سکتے ہیں۔
    topic.unknown: مجھے ٹھیک سے سمجھ نہیں آیا۔ آپ پوچھ سکتی ہیں کہ دعویٰ کیسے کرنا ہے، ویٹنگ پیریڈ کیا ہوتا ہے، کو-پے یا کیش لیس کے بارے میں، لون یا ای ایم آئی کیسے کام کرتا ہے، یا کوٹیشن کے لیے پوچھ سکتی ہیں۔
    topic.waiting_period: انتظار کی مدت وہ وقت ہے جس کے بعد کچھ دعوے قابل ادائیگی ہوتے ہیں۔ عام طور پر کسی بھی بیماری کے لیے 30 دن، اور آپ کو پہلے سے موجود حالات کے لیے 1 سے 3 سال۔ حادثات پہلے دن سے ہی کور ہوتے ہیں۔
