# Voice for the consumer app: speech in (Sarvam Saaras) and answers read aloud (Sarvam Bulbul). Owner: Member 1
# Audio and transcripts are never stored or logged (CLAUDE.md rule 5): the recording goes to Sarvam once, to be turned
# into text; the text then goes through the normal assistant path (PII masked before any model). The audit row says
# only that a voice turn happened, the language and the length, never the words.
stt:
  url: https://api.sarvam.ai/speech-to-text
  model: saaras:v3
  max_audio_bytes: 2000000        # a 20 second clip is about 200 KB; this is a ceiling, not a target
  max_seconds: 20                 # the recorder stops here (Sarvam's real-time endpoint allows about 30)
  timeout_s: 30
tts:
  url: https://api.sarvam.ai/text-to-speech
  model: bulbul:v3
  max_chars: 450
  timeout_s: 30
  # languages Bulbul can speak. Assamese and Urdu have no voice here: the app shows no speaker for them.
  languages: [bn-IN, en-IN, gu-IN, hi-IN, kn-IN, ml-IN, mr-IN, od-IN, pa-IN, ta-IN, te-IN]
  # Hinglish is Hindi written in Latin letters: it is read by the Hindi voice
  language_aliases: {hi-Latn: hi-IN}
