# SIMULATED insurer registry: what "the insurer's own record" says about a claim. Owner: Member 1
# In production this is the insurer's claim-status API (or the IRDAI-aligned claim-status exchange); here a mock adapter
# reads this file. EVERY NAME, NUMBER AND AMOUNT BELOW IS INVENTED DEMO DATA, not a real person, policy or claim.
#
# What it is for (CLAUDE.md rules 2, 3, 12): an approval letter is only a document, and a document can be altered. Before any
# advance is sized from a letter, its claim reference and amounts are checked against this record (consumer/verify.py):
#   * found and equal      -> the letter is confirmed
#   * found but different  -> the letter does not match the insurer: no advance (a person must look)
#   * not found            -> cannot be confirmed: a person must check before any financing
# A claim that is not here is NOT called fraudulent: it is simply not confirmed.
# status: approved (payment pending) | settled (already paid) | pending (still under review) | rejected
